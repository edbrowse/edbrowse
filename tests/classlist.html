<head></head><body>
<p id=show>start</p>
<div id=d1 class="alpha beta alpha">one</div>
<div id=d2>two</div>
<script>
try {
msg = "ok";
isedbrowse = navigator.userAgent.substr(0, 8) == "edbrowse";
d1 = document.getElementById("d1"); d2 = document.getElementById("d2");
cl1 = d1.classList; cl2 = d2.classList;

// classList is a DOMTokenList, it is not an array
if(typeof DOMTokenList != "function") msg += "|no DOMTokenList"
if(cl1 != d1.classList) msg += "|classList created a new instance";
if(!(cl1 instanceof DOMTokenList)) msg += "|classList wrong class"
// classList object creats even if no class.
if(!(cl2 instanceof DOMTokenList)) msg += "|classList 2 wrong class"
if(isedbrowse && cl1.dom$class != "DOMTokenList") msg += "|bad dom$class"
if(Object.prototype.toString.call(cl1) != "[object DOMTokenList]")
msg += "|bad toStringTag"
if(Array.isArray(cl1)) msg += "|classList is still an array"

if(d1.getAttribute("class") != "alpha beta alpha") msg += `|bad class ${d1.getAttribute("class")}`;
if(d1.className != "alpha beta alpha") msg += `|bad classname ${d1.className}`;

// duplicates fold together, and no class attribute means no tokens
if(cl1.length != 2) msg += `|bad length ${cl1.length}`
if(cl2.length != 0) msg += `|empty class has length ${cl2.length}`
if(cl1.value != "alpha beta alpha") msg += `|bad value ${cl1.value}`
if(String(cl1) != "alpha beta alpha") msg += "|bad stringifier"
if(cl1[0] != "alpha" || cl1[1] != "beta") msg += "|bad index access"
if(cl1.item(1) != "beta" || cl1.item(9) !== null) msg += "|bad item"
if(cl1.item("1") != "beta" || cl1.item(9) !== null) msg += "|bad item"
if([...cl1].join("-") != "alpha-beta") msg += "|bad iterator"
if(Object.keys(cl1).join() != "0,1") msg += "|bad own keys"
let seen = ""; cl1.forEach((t,i) => seen += i + t);
if(seen != "0alpha1beta") msg += `|bad forEach ${seen}`
if([...cl1.keys()].join() != "0,1") msg += "|bad keys"
if([...cl1.values()].join() != "alpha,beta") msg += "|bad values"
if([...cl1.entries()].map(e=>e.join(":")).join() != "0:alpha,1:beta")
msg += "|bad entries"

// the mutators write back through the class attribute
cl1.add("gamma", "beta")
if(d1.className != "alpha beta gamma") msg += `|bad add ${d1.className}`
cl1.remove("beta")
if(d1.className != "alpha gamma") msg += `|bad remove ${d1.className}`
if(cl1.replace("alpha", "delta") !== true) msg += "|replace return"
if(d1.className != "delta gamma") msg += `|bad replace ${d1.className}`
if(cl1.replace("nope", "x") !== false) msg += "|replace found nothing"
if(cl1.toggle("gamma") !== false || d1.className != "delta")
msg += `|bad toggle off ${d1.className}`
if(cl1.toggle("gamma") !== true || d1.className != "delta gamma")
msg += `|bad toggle on ${d1.className}`
if(cl1.toggle("gamma", true) !== true || d1.className != "delta gamma")
msg += "|bad forced toggle"
if(cl1.toggle("delta", false) !== false || d1.className != "gamma")
msg += `|bad forced untoggle ${d1.className}`
cl1.value = "  eta   theta "
if(cl1.length != 2 || cl1.value != "  eta   theta ")
msg += `|bad value setter ${cl1.value}`

if(cl2.value !== "") msg += `|missing class shows list value ${cl2.value}`;
cl2.add()
if(!d2.hasAttribute("class")) msg += "|empty add didn't create the attribute"
if(d2.className != "") msg += "|empty add didn't make empty className"
if(cl2.length != 0) msg += "|d2 classList length nonzero";

// the empty token, and a token holding a space, are errors
for(const f of [() => cl1.add(""), () => cl1.remove(""),
() => cl1.toggle(""), () => cl1.add("a b")]) {
let threw = false;
try { f() } catch(e) { threw = true }
if(!threw) msg += "|bad token did not throw"
}

// class has no supported tokens, so supports throws, as chrome does
let sthrew = false;
try { cl1.supports("eta") } catch(e) { sthrew = true }
if(!sthrew) msg += "|supports did not throw"

// and the class attribute still drives getElementsByClassName
d1.className = "shoe";
if(document.getElementsByClassName("shoe").length != 1) msg += "|gebcn broken"
// and it drives classList
if(cl1[0] != "shoe") msg += "|change of class didn't change list";
if(cl1["0"] != "shoe") msg += "|failed to access by '0'";
if(cl1.item(0.375) != "shoe") msg += "|item index didn't truncate from float to int";
if(cl1.item('0') != "shoe") msg += "|item index didn't change from string to int";
if(cl1.item('blah') != "shoe") msg += "|item index of nonsense string";
if(cl1.item(atob) != "shoe") msg += "|item index of function";
if(cl1[0.375]) msg += "|unexpected direct access via a real number";
if(cl1.length != 1) msg += "|change of class didn't change length";
if(!cl1.contains("shoe")) msg += "|list doesn't contain shoe";

d1.removeAttributeNode(d1.getAttributeNode("class"));
if(d1.hasAttribute("class")) msg += "|class didn't go away";
if(d1.className !== "") msg += "|className didn't become empty";
if(cl1 != d1.classList) msg += "|new classList after removeAttribute";
// try index before we call any instance methods
if(cl1[0] !== undefined) msg += `|shoe didn't go away ${cl1[0]}`;
if(cl1.item(0) !== null) msg += "|item 1 didn't go away";
if(cl1.value !== "") msg += "|list value didn't become empty";
if(cl1.length != 0) msg += "|length didn't go away";
if(cl1.keys.length != 0) msg += "|keys didn't go away";
if(!cl1.toggle("sock")) msg += "|sock didn't turn on";
if(d1.className != "sock") msg += "|className not sock";
cl1.add("sock");
if(d1.className != "sock") msg += "|className not sock after sock";
if(cl1.length != 1) msg += "|multiple socks";

// namedNodeMap. Some of this is tested intrinsically when we access Attributes.
// In fact chrome won't let me create the map on its own.
if(isedbrowse) m = new NamedNodeMap;
else mdiv = document.createElement("div"), m = mdiv.attributes;
function make_attr(n, v) {
let a;
if(isedbrowse) {
a = new Attr;
a.name = n, a.value = v;
} else {
// chrome won't let me new Attr, just like I can't new NamedNodeMap
show.setAttribute(n, v);
a = show.getAttributeNode(n);
show.removeAttribute(n);
}
return a;
}

// first three are reserved words that shouldn't create links
a0 = make_attr("length", 39);
a1 = make_attr("3", "yamaha");
a2 = make_attr("item", "flop");
// then a couple that should create links
a3 = make_attr("j", true);
a4 = make_attr("K@", "garage");
if(m.setNamedItem(a0) !== null) msg += "|setNamedItem not null";
m.setNamedItem(a1);
m.setNamedItem(a2);
m.setNamedItem(a3);
m.setNamedItem(a4);
if(m.j != a3) msg += "|no j link";
if(m["K@"] != a4) msg += "|no K@ link";
if(m[" k"]) msg += "|unexpected k link";
if(typeof m.item != "function") msg += "|m.item not function";
if(m.length != 5) msg += "|m wrong length";
if(m[2] != a2 || m[4] != a4) msg += "|m bad indexing";
if(m.item("2") != a2 || m.item(4) != a4) msg += "|m bad item indexing";
if(m.item(1.632) != a1) msg += "|m bad truncating";
if(m.item("blah") != a0) msg += "|m nonsense string index";
if(m.item(atob) != a0) msg += "|m function index";
if(m[3] != a3) msg += "|wrong m[3]";
a00 = make_attr("length", 399);
a01 = m.setNamedItem(a00);
if(a01 != a0) msg += "|replace didn't return old attr";
if(m[0].value != 399) msg += "|replace didn't produce 399";
if(m[3].value !== "true") msg += "|m[3].value didn't convert true to string";
a01 = m.removeNamedItem("length");
if(a01 != a00) msg += "|removed item wrong attr";
if(m.length != 4) msg += "| length not 4 after remove";
if(m.getNamedItem("j") != a3) msg += "|couldn't get j after remove";
if(m.getNamedItem("K@") != a4) msg += "|couldn't get  K@ after remove";
if(m.getNamedItem("nothing") !== null) msg += "|nothing didn't return null";
if(m[0] != a1) msg += "|items didn't shift after length removed";
m.removeNamedItem("j");
if(m.j) msg += "|m.j still defined";
if(!m["K@"]) msg += "|m.K@ not defined after j remove";
if(m.length != 3) msg += "|length not 3 after j removed";

show.innerHTML = msg;
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
</body>
