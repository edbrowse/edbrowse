<head></head><body>
<p id=show>start</p>
<p><popup-info id=info1 data-text="Bolognese are folk art sculptures made from Chinese coins."
img="http://www.eklhad.net/dolls/v194513.jpg">unseen</popup-info></p>

<script>
// Test custom elements and custom events
broken = false;
try {
msg = "ok";
isedbrowse = navigator.userAgent.substr(0, 8) == "edbrowse";

ce = customElements; // shorthand
function customTest1() {
// create a new tag see if it calls the constructor.
class jk_construct extends HTMLElement {
constructor() {
super();
 this.found = 4321
}
}
jk_construct.prototype.more = 5432;
ce.define("j-k", jk_construct);
let c = document.createElement("j-k");
if(c.found != 4321) msg += `|c.found ${c.found}`;
if(c.more != 5432) msg += `|c.more ${c.more}`;
if(ce.get("j-k") != jk_construct || ce.getName(jk_construct) != "j-k") msg += "|didn't find name j-k";
if(ce.get("l-m") || ce.getName(atob) != null) msg += "|found l-m";
}
customTest1();

// Here is a popup info class that will be linked to <popup-info>
class PopupInfo extends HTMLElement {
  constructor() { super(); }
  connectedCallback() {
    const shadow = this.attachShadow({ mode: "open" });
    const wrapper = document.createElement("span");
    const icon = document.createElement("span");
    const info = document.createElement("span");
    info.setAttribute("class", "info");
    // Take attribute content and put it inside the info span
    const text = this.getAttribute("data-text");
    info.textContent = ' ' + text;
    // Insert icon
    let imgUrl;
    if (this.hasAttribute("img")) {
      imgUrl = this.getAttribute("img");
    } else {
      imgUrl = "img/default.png";
    }
    const img = document.createElement("img");
    img.src = imgUrl;
// put an alt on it just so it shows up
    img.alt = "popimage";
    icon.appendChild(img);
    shadow.appendChild(wrapper);
    wrapper.appendChild(icon);
    wrapper.appendChild(info);
  }
}

// first popup tag already exists but should be unknown
if(!(info1 instanceof HTMLElement)) msg += "|info1 not html element";
if(info1.nodeName != "POPUP-INFO" || info1.tagName != info1.nodeName) msg += `|info1 pre nodeName ${info1.nodeName}`;
ce.define("popup-info", PopupInfo);
// that tag synchronously becomes an instance of PopupInfo.
if(!(info1 instanceof PopupInfo)) msg += "|info1 not PopupInfo";
if(info1.nodeName != "POPUP-INFO" || info1.tagName != info1.nodeName) msg += `|info1 post nodeName ${info1.nodeName}`;
if(info1.attributes.length != 3) msg += `|info1 carried ${info1.attributes.length} attributes across`;
if(info1.dataset.text.substr(0, 5) != "Bolog") msg += `|bad info1.dataset.text ${info1.dataset.text}`;
// preserve the children, even though they will not be seen when shadowRoot appears
if(info1.textContent != "unseen") msg += `|info1 content ${info1.textContent}`;
if(!info1.shadowRoot) msg += "|shadowRoot not created";

// spin up a new custom element and link into the tree
info2 = document.createElement("popup-info");
if(!(info2 instanceof PopupInfo)) msg += "|info2 not PopupInfo";
if(info2.nodeName != "POPUP-INFO") msg += `|info2 nodeName ${info2.nodeName}`;
info2.setAttribute("data-text", "freezer");
if(info2.shadowRoot) msg += "|info2 shadowRoot too early";
info2.style.display = "none"; // don't need to see the second one
info1.parentNode.append(info2);
if(!info2.shadowRoot) msg += "|info2 shadowRoot not created";
// remember we put in an extra space
if(info2.shadowRoot.lastChild.lastChild.lastChild.data != " freezer") msg += "|freezer not present";

show.innerHTML = msg;
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>"); broken = true; }
</script>
</body>
