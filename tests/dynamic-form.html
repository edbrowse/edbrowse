<body v+='d' onsubmit="v += 'f'" onreset="v='bodyreset'">
<p id=show>start</p>
<form action= "javascript:"
onsubmit="v += 'e'"
*#  :&quot;`@what=where>
<input name=me type=text value="Yogi Bear">
<br>
  <fieldset>
    <legend>Please select your preferred contact method:</legend>
    <div id=under>
      <input type="radio" id="contactChoice1" name="contact" value="email" />
      <label for="contactChoice1">Email</label>
      <input type="radio" id="contactChoice2" name="contact" value="phone" />
      <label for="contactChoice2">Phone</label>
      <input type="radio" id="contactChoice3" name="contact" value="mail" />
      <label for="contactChoice3">Mail</label>
<br id=end-choices>
<input type=hidden id=xx name=h value=secret>
Fruit: <select name=fruit multiple=elephant>
<option value=a>apple
<option value=o>orange
<option value=l>lemon
<optgroup label=berries>
<option value=r>raspberry
</optgroup>
</select>
    </div>
  </fieldset>
    <div>
      <button type="submit" onclick="v += 'c'">Show</button>
<input type=submit name=act value=Send onclick="v += 'c'">
    </div>
</form>
<pre id="log"></pre>
<div></div>

<script>
try {
// if you press the show button, it shows you the choices you made -
// what will be sent to the server by this form.
// Thus it has an interactive capability, which you can test in edbrowse,
show = document.getElementById("show")
b = document.body;
msg = "ok"
form = document.querySelector("form");
// test weird attribute names
if(form.getAttributeNames().join(';') != 'action;onsubmit;*#;:&quot;`@what') msg += "|form has wrong attributes";
if(form.getAttribute(':&quot;`@what') != "where") msg += "|what where";
const el = form.elements
const fs = el[1]; // fieldset
const fsel = fs.elements; // field set elements
const legend = fs.querySelector("legend")
if(el.length != 9) msg += `|form elements.length ${el.length}`;
if(fsel.length != 5) msg += `|nts.length ${fsel.length}`;
if(legend.form != form) msg += "bad legend.form";
const log = document.querySelector("#log");
// push Show and see the fields.
// This tests FormData, which is third party code.
const button = form.querySelector("button");
button.addEventListener("click", (event) => {
  const data = new FormData(form);
  let output = "";
  for (const entry of data) {
    output = `${output}${entry[0]}=${entry[1]}\n`;
  }
  log.innerText = output;
  event.preventDefault();
});

// add a new radio button dynamically
i = document.createElement("input");
i.type="radio";
i.name="contact";
i.value="carrier pigeon";
const panel = document.getElementById("under");
const br = form.querySelector("#end-choices");
panel.insertBefore(i, br);
panel.insertBefore(document.createTextNode(" Pigeon"), br);
if(el.length != 10) msg += `|updated form elements.length ${el.length}`;
if(fsel.length != 6) msg += `|fieldset elements.length ${fsel.length}`;
// you can fs.removeChild(panel) and verify the input fields are wiped out.
// Then you can add it back again and verify the form resurrects.

// direct access by name
hidden = form.h;
if(hidden.value != "secret") msg += "|no forn name access for hidden";
if(el.h != hidden) msg += "|no element name access for hidden";
hidden.setAttribute("name", "zz");
if(form.zz != hidden) msg += "|no form zz name access for hidden";
if(el.zz != hidden) msg += "|no element zz name access for hidden";
hidden.name = "yy";
if(form.yy != hidden) msg += "|no form yy name access for hidden";
if(el.yy != hidden) msg += "|no element yy name access for hidden";

// call cloneNode and make sure the form machinery, elements, links, etc,
// have been created.
const f2 = form.cloneNode(true)
if(f2.getAttributeNames().join(';') != 'action;onsubmit;*#;:&quot;`@what') msg += "|f2 has wrong attributes";
if(typeof f2.onsubmit != "function") msg += "|f2.onsubmit not a function";
if(b.onchange !== null) msg += "|default onchange not null";
if(f2.elements.length != 10) msg += `|clone elements.length ${f2.elements.length}`;
if(f2.contact.length != 4) msg += `|clone contact.length ${f2.contact.length}`;
if(f2.contact[0] != f2.elements[2]) msg += "|clone contact elements mismatch";
if(f2.contact[0].form != f2) msg += "|clone input.form mismatch";
if(f2.action != form.action) msg += "|clone action mismatch";
// This test doesn't pass in chrome, fs$ is our own creation.
// if(f2.contact[3].fs$ != f2.elements[0]) msg += "|clone input.fs$ mismatch";

// can we click on some things?
// This is at the top and capture, so should run first.
window.addEventListener("click", ()=>{v = 'a'}, true);
handle_b = ()=>{v += 'b'};
document.addEventListener("click", handle_b, true);
// this one is for bubble.
// use a real function not arow function, so we can tap into this
b.addEventListener("click", function(e) { v += this.getAttribute("v+") + e.eventPhase}, false);
// you can click on almost anything, even a div section
b.querySelector("div").click();
if(v != "abd3") msg += `|div click ${v}`;
i=document.querySelector("input[type=submit]");
// this will dispatch the click even, and also submit the form,
// because that's what the input says to do upon click.
i.click();
if(v != "abcd3ef") msg += `|input click ${v}`;

// select an option, push the button
sel = b.querySelector("select");
if(sel.multiple !== true) msg += "|select not multiple";
if(sel.type !== "select-multiple") msg += "|select wrong type";
so = sel.options; // live array
sso = sel.selectedOptions;
if(so.length != 4 || sso.length != 0) msg += "|bad initial option count";
lemon = so[2];
if(lemon.text != "lemon" || lemon.value != "l" || lemon.selected) msg += "|bad lemon";
lemon.selected = true;
if(sso[0] != lemon) msg += "|lemon not in select";
button.click();
if(v != "abcd3") msg += `|button v ${v}`;
if(log.innerText != "me=Yogi Bear\nyy=secret\nfruit=l\n") msg += "improper log after button";
o = new Option("peach", 'p');
sel.add(o);
o = new Option("cherry", 'c');
sel.add(o, 1);
o.selected = true;
v = ""; for(let c of so) v += c.value;
if(v != "acolrp") msg += `|fruits after add ${v}`;
v = ""; for(let c of sso) v += c.value;
if(v != "cl") msg += `|selected fruits after add ${v}`;
og = sel.querySelector("optgroup");
o = new Option("blueberry", 'b');
sel.add(o,4);
if(og.childElementCount != 2) msg += "|expected 2 berries";
sel.remove(2);
sel.lastElementChild.selected = true;
v = ""; for(let c of so) v += c.value;
if(v != "aclbrp") msg += `|fruits after remove ${v}`;
v = ""; for(let c of sso) v += c.value;
if(v != "clp") msg += `|selected fruits after remove ${v}`;

// choose a method of contact, and pseudo run the form again.
document.removeEventListener("click", handle_b, true);
q = b.querySelectorAll("input[type=radio]");
i4 = q[3];
i3 = q[2];
i4.click();
if(v != "ad3") msg += `|pigeon click ${v}`;
if(!i4.checked) msg += "|pigeon not checked";
hidden.value = "special";
form.me.value = "Boo-Boo";
button.click();
if(log.innerText != "me=Boo-Boo\ncontact=carrier pigeon\nyy=special\nfruit=c\nfruit=l\nfruit=p\n") msg += "|improper log after second button";

// check a different radio button
i3.click();
if(!i3.checked || i4.checked) msg += "|pigeon not unchecked";
i4.checked = true;
if(!i4.checked || i3.checked) msg += "|mail not unchecked";

// put an option on the end of the option group, which cannot be done by sel.add
o = document.createElement("option");
o.text = "boysenberry";
o.value = 'y';
o.selected = true;
og.appendChild(o);
if(og.childElementCount != 3) msg += "|expected 3 berries";
v = ""; for(let c of so) v += c.value;
if(v != "aclbryp") msg += `|fruits after append ${v}`;
v = ""; for(let c of sso) v += c.value;
if(v != "clyp") msg += `|selected fruits after append ${v}`;
if(sel.selectedIndex != 1 || sel.value != "c") msg += "|first selection charry not in value";

// there is no reset button to push, but I can call the method directly
form.reset();
if(v != "bodyreset") msg += "|onreset didn't run";
v = ""; for(let c of so) v += c.value;
if(v != "aclbryp") msg += `|fruits after reset ${v}`;
if(sso.length) msg += "|selected fruits after reset";
// hidden fields do not go back upon form reset.
button.click();
if(log.innerText != "me=Yogi Bear\nyy=special\n") msg += "|improper log after reset";
// and the form submit function, rather than a click
v = "j";
form.submit();
if(v != "j") msg += `|form submit ${v}`

// a select 1 list is different, and in some ways more complicated
s1 = document.createElement("select");
if(s1.multiple !== false) msg += "|select not 1";
if(s1.type !== "select-one") msg += "|s1 wrong type";
if(s1.selectedIndex !== -1) msg += "|s1 wrong index";
o = new Option("dog", 'd');
s1.add(o);
o = new Option("cat", 'c');
s1.add(o);
o = new Option("bird", 'b');
s1.add(o);
so = s1.options;
sso = s1.selectedOptions;
v = ""; for(let c of so) v += c.value;
if(v != "dcb") msg += `|wrong animals ${v}`
v = ""; for(let c of sso) v += c.value;
if(v != "d") msg += `|no dog default ${v}`;
if(s1.selectedIndex != 0) msg += `|bad dog index ${s1.selectedIndex}`;
so[1].selected = true; // this should deselect the dog
v = ""; for(let c of sso) v += c.value;
if(v != "c") msg += `|no cat replace ${v}`;
if(s1.selectedIndex != 1) msg += `|bad cat index ${s1.selectedIndex}`;
so[1].selected = false;
// not allowed to deselect
if(sso.length == 0) msg += "|cat went away";
// bringing in an option default selected - becomes selected
o = new Option("goldfish", 'g');
o.defaultSelected = true;
s1.add(o);
v = ""; for(let c of so) v += c.value;
if(v != "dcbg") msg += "|goldfish not added";
v = ""; for(let c of sso) v += c.value;
if(v != "g") msg += "|goldfish not selected";
if(s1.selectedIndex != 3) msg += "|bad goldfish index";
// remove bird, then goldfish, the latter not allowed.
s1.remove(2);
v = ""; for(let c of so) v += c.value;
if(v != "dcg") msg += "|bird not gone";
v = ""; for(let c of sso) v += c.value;
if(v != "g") msg += "|goldfish disturbed by bird";
if(s1.selectedIndex != 2) msg += "|index not decremented";
s1.remove(2);
v = ""; for(let c of so) v += c.value;
if(v != "dc") msg += "|goldfish remains";
v = ""; for(let c of sso) v += c.value;
if(v != "d") msg += "|goldfish not dog";
if(s1.selectedIndex != 0) msg += "|index not 0 after goldfish action";
if(s1.value != 'd') msg += "|s1.value didn't go back to d";

// search params has some similarity with form data
usp = new URLSearchParams;
so = sel.options;
so[0].selected = so[3].selected = true;
form.me.value = "yes: ⅔ × ½ = ⅓";
for(const entry of new FormData(form)) usp.append(entry[0], entry[1]);
// toString encodes it as per http get mathod
if(usp != "me=yes%3A+%E2%85%94+%C3%97+%C2%BD+%3D+%E2%85%93&yy=special&fruit=a&fruit=b") msg += `|bad usp encoding ${usp}`;
if(!usp.has("fruit")) msg += "|usp has no fruit";
if(usp.has("vegetable")) msg += "|usp has vegetable";
v = ""; for(let c of usp.keys()) v += ':' + c;
if(v != ":me:yy:fruit:fruit") msg += `|usp bad keys ${v}`;

show.innerHTML = msg;
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
</body>
