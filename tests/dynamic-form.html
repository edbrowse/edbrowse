<body>
<p id=show>start</p>
<form action= http://localhost:1200>
  <fieldset>
    <legend>Please select your preferred contact method:</legend>
    <div id=under>
      <input type="radio" id="contactChoice1" name="contact" value="email" />
      <label for="contactChoice1">Email</label>
      <input type="radio" id="contactChoice2" name="contact" value="phone" />
      <label for="contactChoice2">Phone</label>
      <input type="radio" id="contactChoice3" name="contact" value="mail" />
      <label for="contactChoice3">Mail</label>
<br>
<input type=hidden name=h value=secret>
Fruit: <select name=fruit multiple>
<option value=a>apple
<option value=o>orange
<option value=l>lemon
</select>
    </div>
  </fieldset>
    <div>
      <button type="submit">Show</button>
<input type=submit name=act value=Send>
    </div>
</form>
<pre id="log"></pre>

<script>
show = document.getElementById("show")
msg = "ok"
const form = document.querySelector("form");
const el = form.elements
const fs = el[0]; // fieldset
const fsel = fs.elements; // field set elements
if(el.length != 8) msg += `|form elements.length ${el.length}`;
if(fsel.length != 5) msg += `|fieldset elements.length ${fsel.length}`;
const log = document.querySelector("#log");
// push Show and see the fields.
// This tests FormData, which is third party code.
const button = form.querySelector("button");
button.addEventListener("click", (event) => {
  const data = new FormData(form);
  let output = "";
  for (const entry of data) {
    output = `${output}${entry[0]}=${entry[1]}\r`;
  }
  log.innerText = output;
  event.preventDefault();
});

// add a new radio button dynamically
i = document.createElement("input");
i.type="radio";
i.name="contact";
i.value="carrier pigeon";
const panel = document.getElementById("under");
const br = form.querySelector("br");
panel.insertBefore(i, br);
panel.insertBefore(document.createTextNode(" Pigeon"), br);
if(el.length != 9) msg += `|form elements.length ${el.length}`;
if(fsel.length != 6) msg += `|fieldset elements.length ${fsel.length}`;
// you can fs.removeChild(panel) and verify the input fields are wiped out.
// Then you can add it back again and verify the form resurrects.
// call cloneNode and make sure the form machinery, elements, links, etc,
// have been created.
const f2 = form.cloneNode(true)
if(f2.elements.length != 9) msg += `|clone elements.length ${f2.elements.length}`;
if(f2.contact.length != 4) msg += `|clone contact.length ${f2.contact.length}`;
if(f2.contact[0] != f2.elements[1]) msg += "|clone contact elements mismatch";
if(f2.contact[0].form != f2) msg += "|clone input.form mismatch";
if(f2.action != form.action) msg += "|clone action mismatch";
// This test doesn't pass in chrome
//if(f2.contact[3].fs$ != f2.elements[0]) msg += "|clone input.fs$ mismatch";
show.innerHTML = msg
</script>
</body>
