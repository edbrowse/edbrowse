<body>
<p id=show>start</p>
<div id=place></div>
<template id=tt>
<h3> Fruit </h3> 
 <ol 	 k=1   l=2 data-alpha-bet="a b c" style='color:red;padding-top: 10px'><li>plum<li>pear<li>peach</ol>
<script>++fruitAttach</script>
</template>

<script>
// fragments and templates
try {
show = document.getElementById("show")
msg = "ok"
b = document.body
if(!document instanceof Document) msg += "|document not Document"
if(!document instanceof HTMLDocument) msg += "|document not HTMLDocument"
frag = document.createDocumentFragment()
if(frag.ownerDocument != document) msg += "|frag bad owner"
frag.appendChild(document.createElement("hr"))
frag.appendChild(document.createElement("hr"))
frag.appendChild(document.createElement("hr"))
hr = frag.firstChild
b.appendChild(frag)
if(frag.children.length) msg += "|lines did not leave frag"
q = document.querySelectorAll("body>hr")
if(q.length != 3) msg += "|lines did not move to body"
if(q[0] != hr) msg += "|first hr doesn't match"
b.removeChild(b.lastChild)
b.removeChild(b.lastChild)
frag.appendChild(document.createElement("div"))
b.insertBefore(frag, hr)
if(frag.hasChildNodes()) msg += "|div did not leave frag"
q = document.querySelectorAll("body>div+hr")
if(q[0] != hr) msg += "|div did not move to body"

tt = document.getElementById("tt")
if(document.querySelector("body>div+template") != tt) msg += "|template not where it should be"
fruitAttach = 0;
// now template to fragment. C has already done the conversion,
// we just need to grab it.
tf = tt.content;
if(!tf instanceof DocumentFragment) msg += "|tf not a fragment"
s1 = tf.firstChild;
if(tf.parentElement !== null) msg += "|fragment has parent"
if(s1.parentElement !== null) msg += "|parent element is fragment"
if(show.parentElement != b) msg += "|show parent not body"
// two instances of the template to play with
i1 = document.importNode(tf, true);
i2 = document.importNode(tf, true);
// make sure attributes ccarry across
i1ol = i1.querySelector("ol")
if(!i1ol) msg += "|can't find ol in clone"
if(i1ol.previousElementSibling.nodeName != "H3") msg += "|previous not h3"
i1ola = i1ol.attributes;
if(i1ola.length != 4) msg += `| ol in clone has ${i1ola.length} attributes`
if(i1ol.getAttribute("k") != 1 ||
i1ola.l.value != 2 || i1ol.getAttributeNode("k") != i1ola.k) msg += "|k l attributes didn't carry across";
if(i1ol.style.color != "red") msg += "| color red not in clone"
if(i1ol.style.paddingTop != "10px") msg += "| padding 10px not in clone"
place = document.getElementById("place")
place.appendChild(i1);
place.append(i2);
if(fruitAttach != 2) msg += `|wrong fruitAtach ${fruitAttach}`
q = document.querySelectorAll("body>div>ol>li");
if(q.length != 6) msg += `|wrong fruit count ${q.length}`
// detach and reattach the script, should not run again.
s1 = b.querySelector("ol+script")
place.removeChild(s1)
place.prepend(s1)
if(fruitAttach > 2) msg += `|script reran ${fruitAttach}`
// third clone - this time with inconsistent color
tf.children[1].style.color = "green"
i3 = document.importNode(tf, true);
place.prepend(i3)
q = place.children;
if(q[0].nodeName != "H3" || q[1].nodeName != "OL" || q[2].nodeName != "SCRIPT") msg += "|i3 didn't prepend"
if(q[1].style.color != "green") msg += "|green didn't displace red"
if(q[1].dataset.alphaBet != "a b c") msg += "|alphaBet didn't carry across"
if(fruitAttach != 3) msg += `|prepend fruit count ${fruitAttach}`
place.removeChild(place.firstChild);
place.removeChild(place.firstChild);
place.removeChild(place.firstChild);
place.removeChild(place.firstChild);
place.removeChild(place.firstChild);
place.removeChild(place.firstChild);
place.append("cake ", "ice cream")
if(place.lastChild.data != "ice cream") msg += "|lost cake ice cream"

div = document.createElement("div")
s1 = document.createElement("p")
div.append(s1)
s1.textContent = "3"
p = document.createElement("p")
p.textContent = "5"
s1.insertAdjacentElement("afterend", p)
p = document.createElement("p")
p.textContent = "4"
s1.insertAdjacentElement("beforeend", p)
p = document.createElement("p")
p.textContent = "1"
s1.insertAdjacentElement("beforebegin", p);
p = document.createElement("p")
p.textContent = "2"
s1.insertAdjacentElement("afterbegin", p)
if(div.textContent != "12345") msg += `|bad adjacent element ${div.textContent}`

s1 = b.querySelector("li")
if(b.contains(null)) msg += "|contains null"
if(!b.contains(s1) || s1.contains(b) || !b.contains(b)) msg += "|bad contains"
if(b.compareDocumentPosition(b) != 0) msg += "|self nonzero"
if(show.compareDocumentPosition(b.lastChild) != b.DOCUMENT_POSITION_FOLLOWING) msg += "|neighbors not follow"
if(b.lastChild.compareDocumentPosition(show) != b.DOCUMENT_POSITION_PRECEDING) msg += "|neighbors not precede"
if(show.compareDocumentPosition(s1) != b.DOCUMENT_POSITION_FOLLOWING) msg += "|cousins not follow"
if(b.compareDocumentPosition(s1) != (b.DOCUMENT_POSITION_FOLLOWING | b.DOCUMENT_POSITION_CONTAINED_BY)) msg += "|s1 not follow"
if(s1.compareDocumentPosition(b) != (b.DOCUMENT_POSITION_PRECEDING | b.DOCUMENT_POSITION_CONTAINS)) msg += "|s1 not precede"
// template fragment is not in the tree at all
// chrome sets other bits besides the disconnected bit.
// That makes no sense to me!
if(!(show.compareDocumentPosition(tf.firstChild) & b.DOCUMENT_POSITION_DISCONNECTED)) msg += "|unrelated compare"

if(show.ELEMENT_NODE != 1 || show.DOCUMENT_FRAGMENT_NODE != 11 ||
show.TEXT_NODE != 3)
msg += "|no node types"

/* This is a chrome only test, and I don't like to do those very often,
but it will be a long time if ever that edbrowse does exactly the same thing,
and it should perhaps be documented.
tt.innerHTML produces the html that was originally in the template.
But it's not an exact copy.
I didn't close <li>, but when it comes back out, there is a closing </li> tag.
The html syntax is cleaned up.
And whitespace between tag attributes is compressed.
Also, every attribute value is quoted, with double quotes,
even if I didn't quote it, or if I used single quotes.
So I verify what chrome does, and maybe some day edbrowse will do the same.
If I don't get a match, how do I show you what edbrowse produced?
I can't just alert it.
If I paste it into show.innerHTML, chrome will render the tags.
But there's a trick, which you will see below.
One way I could approach this, from the edbrowse side, only requires
a few lines of code. It's sweet.
innerHTML getter {
    let d = document.createElement('div')
    d.innerHTML = this.inner$HTML;
    return d.outerHTML;
}
Thats pretty damn close, but not exact.
Maybe it's close enough. Better than leaving it untouched.
I don't know anywhere in the wild where this matters -
unless some gatekeeper uses it to prove we are a perfect browser,
and that kind of shit does happen. */

isedbrowse = navigator.userAgent.substr(0, 8) == "edbrowse";
if(!isedbrowse) {
if(tt.innerHTML !==
'\n<h3> Fruit </h3> \n <ol k="1" l="2" data-alpha-bet="a b c" style="color: green; padding-top: 10px;"><li>plum</li><li>pear</li><li>peach</li></ol>\n<script>++fruitAttach<'
+ // remember we have to break up the closing script tag
'/script>\n')
msg += `|unexpected inner html <textarea>${tt.innerHTML}</textarea>`
}

// build from scratch and check outerHTML
div = document.createElement("div")
p = document.createElement("p")
p.setAttribute("jk", "a b c76")
p.textContent = " first paragraph ";
div.append(p)
ol = document.createElement("ol")
ol.setAttribute("start", 37)
li = document.createElement("li")
li.textContent = "Happy"
ol.append(li)
li = document.createElement("li")
li.textContent = "Sneezy"
ol.append(li)
li = document.createElement("li")
li.textContent = "Doc"
ol.append(li)
div.append(ol)
div.append(document.createComment(" come on baby light my fire "))
// In this simple example, chrome and edbrowse agree
if(div.outerHTML !=
'<div><p jk="a b c76"> first paragraph </p><ol start="37"><li>Happy</li><li>Sneezy</li><li>Doc</li></ol><!-- come on baby light my fire --></div>')
msg += `|unexpected outer html <textarea>${div.outerHTML}</textarea>`

// insertAdjacentHTML
div = document.createElement("div")
s1 = document.createElement("p")
div.append(s1)
s1.textContent = "3"
s1.insertAdjacentHTML("afterend", "<p><span jk=23>5</span></p>")
s1.insertAdjacentHTML("beforeend", "<p><span jk=23>&gt;4</span></p>")
s1.insertAdjacentHTML("beforebegin", "<p><span jk=23>1</span></p>");
s1.insertAdjacentHTML("afterbegin", "<p><span jk=23>2&lt;</span></p>")
if(div.textContent != "12<3>45") msg += `|bad adjacent html ${div.textContent}`
// this catches 4 out of 5, because of the jk restriction
q = div.querySelectorAll('p>span[jk="23"]');
if(q.length != 4) msg += `|bad adjacent html length ${q.length}`
h = ""; q.forEach((t)=>h+=t.firstChild.data);
if(h != "12<>45") msg += `|qsa(adjacent) has wrong order ${h}`;

// insertAdjacentText
div = document.createElement("div")
s1 = document.createElement("p")
div.append(s1)
s1.textContent = "green"
s1.insertAdjacentText("afterEnd", " violet");
s1.insertAdjacentText("afterEnd", " indigo");
s1.insertAdjacentText("beforeBegin", "red ");
s1.insertAdjacentText("beforeBegin", "orange ");
s1.insertAdjacentText("afterBegin", "yellow ");
s1.insertAdjacentText("beforeEnd", " blue");
if(div.textContent != "red orange yellow green blue indigo violet") msg += `|bad adjacent text ${div.textContent}`

show.innerHTML = msg;
} catch(e) { show.innerHTML = "blowup " + e;}
</script>
