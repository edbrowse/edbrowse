/* frames from the internet, or frames internally generated.

then invoke <chromeline. */

try {
show = document.getElementById("show")
msg = "ok";
if(frames.length != 1) msg += `|initial frame count ${frames.length}`;
f1 = frames[0]; // force expansion in edbrowse
b = document.body;

// There's a slot for the frame, but it loads asynchronously.
// We can't test for anything related to this frame now.

// While we're waiting, let's make an internal frame.
f2 = document.createElement("iframe");
if(frames.length != 1) msg += "|frames length changed too early";
b.appendChild(f2);
if(frames.length != 2) msg += "|frames length not 2";
// edbrowse creates the empty window and document right away, chrome wait
// til it is attached. Well we already attached it above.
f2w = f2.contentWindow;
f2d = f2.contentDocument;
if(f2d.body.nodeName != "BODY") msg += "|no f2 body";
s2 = document.createElement("script");
s2.text = "document.zz = 234";
s2.setAttribute("a", 1);
if(s2.ownerDocument != document) msg += "|bad s2 owner before attach";
f2d.body.appendChild(s2);
if(f2d.zz != 234) msg += "|script in frame didn't run";
if(top != window) msg += "|bad self top";
if(parent != window) msg += "|bad self parent";
if(f2w.top != window) msg += "|bad top";
if(f2w.parent != window) msg += "|bad parent";
if(f2d.body.ownerDocument != f2d) msg += "|bad f2 body owner";
if(s2.ownerDocument != f2d) msg += "|bad s2 owner after attach";
if(s2.attributes[0].ownerDocument != f2d) msg += "|bad s2 attr a owner after attach";
s2.setAttribute("b", 2);
if(s2.attributes[1].ownerDocument != f2d) msg += "|bad s2 attr b owner after attach";
s2.remove();
if(s2.ownerDocument != f2d) msg += "|bad s2 owner after detach";
s2.setAttribute("c", 3);
if(s2.attributes[2].ownerDocument != f2d) msg += "|bad s2 attr c owner after attach";
f2d.body.innerHTML = "<p>frame created inline</p>";
p2 = f2d.body.firstChild;
if(p2.nodeName != "P") msg += "|couldn't find paragraph";
if(p2.ownerDocument != f2d) msg += "|bad owner of innerHTML nodes";

setTimeout(()=>{
if(!expanded) msg += "|frame onload didn't run";
if(f1.zz != 789) msg += "|zz not found";

if(b.querySelector("h1")) msg += "|found h1 by qsa from top frame";
q = b.getElementsByTagName("h1");
if(q.length) msg += "|found h1 by tag name from top frame";
show.innerHTML = msg;
}, 300);

} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
