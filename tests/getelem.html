<head><base href="http://rush.yyz.com/instrumental"></head>
<body>
<p id=show>start</p>
<img src=http://this.that.com/something.png id=q0 alt="first image"></img>
<a></a><a href=ftp://this.that.com/hello>what</a>
<area href=http://nuts.com>area</area>
<script>
// test the behavior of the getElements functions
// when multiple scripts are involed, use the broken flag so we don't
// just march on after a javascript error.
broken = false;
try {
show = document.getElementById("show")
b = document.body
img = document.images; // an HTMLCollection
li = document.links; // a bizarre HTMLCollection
msg = "ok";
if(img.length != 1) msg += `|bad img.length ${img.length}`
// both a and area go into links, but only if they have the href attribute,
// and even if that href attribute is empty.
if(li.length != 2) msg += `|bad li.length ${li.length}`
if(li[0].protocol != "ftp:") msg += `|bad protocol ${li[0].protocol} on links[0]`
at = document.getElementsByTagName("a") // different from document.links
an = document.getElementsByName("sock")
ac = document.getElementsByClassName("shoe")
if(at+":"+an+":"+ac != "[object HTMLCollection]:[object NodeList]:[object HTMLCollection]") msg += "|collection shows wrong type"
// at has both <a> entries and not <area>
if(at.length != 2) msg += `|bad at.length ${at.length}`
if(at[1].hostname != "this.that.com") msg += `|bad at[1] hostname ${at[1].hostname}`
// add a node that joins all three collections
q1 = document.createElement("h1")
q1.setAttribute("name", "sock")
if(q1.name == "sock") msg += "|unexpected name spilldown"
q1.setAttribute("class", "shoe")
b.appendChild(q1)
if(at.length != 2 || ac.length != 1 || an.length != 1) msg += "|lengths are not 2 1 and 1 after append"
if(ac.sock != q1) msg += "|ac.sock not present"
q2 = document.createElement("div")
q2.name = "sock"; // properties are not sufficient
q2.class = "shoe";
b.appendChild(q2)
if(ac.length > 1 || an.length > 1) msg += "|q2 goes in by property alone"
delete q2.name;
delete q2.cllass;
// but changing the class suddenly brings it into the collection
q2.className = "shoe"
if(ac.length != 2 || an.length > 1) msg += "|q2 didn't enter ac after className change"
// now we're going to leave js, bring in an html node, and go back to js.
} catch(e) { broken = true; show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
<br class=shoe>
<script>
if(!broken) {
try {
if(ac.length != 3) msg += "|&lt;br&gt; didn't enter ac"
if(ac.item(2).nodeName != "BR") msg+= "|br not in position"
// this won't change the nodes in the collections,
// but will provide access by property or by namedItem()
q1.id = "j k "
if(ac.length != 3 || an.length != 1) msg += "| collections changed length after id was set"
if(ac.namedItem("j k ") != q1) msg += "|can't access q1 through j k "
// an is NodeList, so there is no id access
if(an["j k "]) msg += "|NodeList shows id access"
// make a collection below document, with two classes
mid = b.getElementsByClassName("shoe boot")
if(mid.length) msg += "|mid has members"
q2.classList.add("boot")
// now both classes, so should be there
if(mid[0] != q2) msg += "|mid didn't pick up q2"
// stop again and this time a tag will become part of a body collection.
// This is not a document collection, and is not rebuilt before each script,
// but it is rebuilt when class is set on the hr tag, so we're ok.
} catch(e) { broken = true; show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
}
</script>

<hr class="boot slipper shoe sandal">

<script>
if(!broken) {
try {
// lastChild is the script we are running right now
hr = b.lastChild. previousElementSibling
if(mid[1] != hr) msg += "|hr didn't enter the collection"
hr.classList.remove("shoe")
if(hr.className != "boot slipper sandal") msg += `|className ${hr.className} wrong after remove`;
if(mid.length != 1 || ac.length != 3) msg += "|wrong lengths after shoe remove";
q2.innerHTML = "<a href=http://www.water.com:731>water</a>"
if(at.length != 3) msg += `|dynamic &lt;a&gt; not in the collection length ${at.length}`
water = q2.firstChild;
if(water.port != 731) msg += `|bad port ${water.port}`
water.id = "xyz"
if(at[2] != water) msg += "|water node not brought in by id"
if(at.xyz != water) msg += "|no xyz reference"
// inline tag without name or class
bat = b.getElementsByTagName("span")
} catch(e) { broken = true; show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
}
</script>

<span></span>

<script>
if(!broken) {
try {
if(bat.length != 1) msg += `|inline &lt;span&gt; not in the collection length ${bat.length}`
document.writeln("<span></span>")
if(bat.length != 2) msg += `|write &lt;span&gt; not in the collection length ${bat.length}`
// hang a collection off an isolated node
div = document.createElement("div")
dat = div.getElementsByTagName("span")
div.innerHTML = "<span></span>"
if(div.firstChild.nodeName != "SPAN") msg += "|span not brought in by innerHTML"
if(dat.length != 1) msg += "|&lt;span&gt; not brought in by innerHTML"
if(bat.length != 2) msg += "|&lt;span&gt; pushed outside of its isolated node"
b.appendChild(div)
if(bat.length != 3) msg += "|&lt;span&gt; didn't join bat after appendChild"

// we should test some instance methods for NodeList, so put at least one
// more node into the list.
hr.setAttribute("name", "sock")
h = ""
an.forEach((c)=> h += c.nodeName)
if(h != "H1HR") msg += `|bad forEach ${h}`
h = ""
for(let e of an.entries()) { h += e[0]; h += e[1].id; }
if(h != "0j k 1") msg += `|bad entries ${h}`
h = 0
for(let k of an.keys()) h += k;
if(h != 1) msg += `|bad keys ${h}`
h = ""
for(let v of an.values()) h += v.tagName;
if(h != "H1HR") msg += `|bad values ${h}`
h = ""
for(const c of an) h += c.getAttribute("name")
if(h != "socksock") msg += `|bad direct of ${h}`

// attribute with href, and cloning an attribute
li[0].setAttribute("href", "goodbye")
if(li[0].getAttribute("href") != "goodbye") msg += "|href attribute not preserved"
if(li[0].href != "http://rush.yyz.com/goodbye") msg += "|bad spilldown resolve"
if(li[0].attributes[0].ownerDocument != document) msg += "|href owner is not document"
a2 = li[0].getAttributeNode("href").cloneNode()
if(a2.name != "href" || a2.value != "goodbye") msg += "|bad attr clone name of value"
if(a2.ownerDocument != document) msg += "|attr clone owner not document"
// now clone the whole node, including its attribute
a2 = li[0].cloneNode(true)
if(a2.firstChild.data != "what") msg += "|clone didn't carry the text"
if(a2.attributes.length != 1 || a2.attributes[0].name != "href") msg += "|clone didn't carry the single href attribute"
if(a2.getAttributeNode("href").value != "goodbye") msg += "|href attribute not preserved in clone"
if(a2.href != "http://rush.yyz.com/goodbye") msg += "|bad spilldown resolve in clone"
if(a2.ownerDocument != document) msg += "|owner of a2 is not document in clone"
if(a2.attributes["href"].ownerDocument != document) msg += "|owner of attribute is not document in clone"
if(a2.protocol != "http:") msg += "|bad a2 protocol"
names = a2.getAttributeNames();
if(names.length != 1 || names[0] != "href") msg += "|bad a2 attribute names"

show.innerHTML = msg;
} catch(e) { broken = true; show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
}
</script>
