<head>
<title>multiline &half; z</title>
<meta http-equiv=yahoo content=inside>
<base href="http://yyz.rush.com/">
</head>
<body>
<p id=show>start</p><!-- fun&lt;&gt; -->
<div id=sample data-html="prefix >
&lt;html&gt;
&lt;body&gt;raw source&lt;/body&gt;
&lt;/html&gt;
suffix" data-dog-food=chow data-fly=leash>visible</div>
<wow></wow>
<script>
try {
show = document.getElementById("show")
msg = "ok";
b = document.body;
isedbrowse = navigator.userAgent.substr(0, 8) == "edbrowse";
head = document.head;
title = head.querySelector("title");
if(title.text != "multiline ½ z") msg += `|bad title ${title.text}`;
meta = head.querySelector("meta");
if(meta.httpEquiv != "yahoo") msg += `|bad equiv ${meta.httpEquiv}`;
if(meta.content != "inside") msg += `|bad meta content ${meta.content}`;
base = head.querySelector("base");
if(base.href != "http://yyz.rush.com/") msg += `|base href wrong ${base.href}`;

// comments don't appear in usual searches
q = b.querySelectorAll("*");
for(let c of q) if(c.nodeType == 8) msg += "|comment found by qsa";
q = b.getElementsByTagName("*");
for(let c of q) if(c.nodeType == 8) msg += "|comment found by getElements";
cmt = show.nextElementSibling;
if(cmt.nodeName != "DIV") msg += "|nextElement didn't jump over comment";
cmt = show.nextSibling;
if(cmt.nodeType != 8) msg += "|next didn't find comment";
if(cmt.data != " fun&lt;&gt; ") msg += `|cmt data ${cmt.data}`;
cmt = document.createTextNode(789);
if(cmt.data !== "789") msg += "|text not 789";
cmt = document.createComment("fluff");
if(cmt.data !== "fluff") msg += "|comment not fluff";
if(isedbrowse) {
// chrome says this is not supported for html documents
cmt = document.createCDATASection("northeast");
if(cmt.data !== "northeast") msg += "|cdata not northeast";
}

let expected = "prefix >\n<html>\n<body>raw source</body>\n</html>\nsuffix"
let sample = document.getElementById("sample")
if(sample.getAttribute("data-html") != expected) msg += `|bad data ${sample.getAttribute("data-html")}`;
if(sample.dataset.html != expected) msg += "| sample html not found in dataset";
if(sample.textContent != "visible") msg += `|bad content ${sample.textContent}`;

// more dataset stuff
if( sample.dataset.dogFood  != "chow") msg += "|dogFood didn't camel case";
if( sample.dataset.fly  != "leash" ||
 sample.getAttribute( "data-fly" ) != "leash") msg += "|wrong fly=leash";
sample.setAttribute( "data-fly" , "swat");
if( sample.dataset.fly  != "swat" ||
 sample.getAttribute( "data-fly" ) != "swat") msg += "|wrong fly=swat";
sample.removeAttribute( "data-fly" );
if( sample.dataset.fly  !== undefined ||
 sample.getAttribute( "data-fly" ) !== null) msg += "|wrong fly=null";

// Test something that was surprisingly tricky to do within the framework
// of quickjs. window is the global object and is an instance of Window,
// which is a class of our own making.
foo = 77; // not in strict mode
window.bar = 88;
if(window.foo != 77 || bar != 88) msg += "|window isn't global";
delete foo; delete bar;
if(!window instanceof Window) msg += "|window not Window";
if(!window instanceof EventTarget) msg += "|window not EventTarget";
if(!window.addEventListener) msg += "|no window event listener";
if(!document instanceof Document) msg += "|document not Document"
if(!document instanceof HTMLDocument) msg += "|document not HTMLDocument"
if(HTMLHRElement != "function HTMLHRElement() { [native code] }") msg += "|bad HR static toString";
if(b.appendChild.toString() != "function appendChild() { [native code] }")
msg += `|instance method toString ${b.appendChild}`;
if(b.append.toString() != "function append() { [native code] }")
msg += `|instance method toString ${b.append}`;
// We tested one method from Node, one from Element, I guess that's good enough.
wow = b.querySelector("wow");
if(!wow instanceof HTMLUnknownElement) msg += "|wow not unknown";

show.innerHTML = msg;
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
</body>
