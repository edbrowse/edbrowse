<body n=1>
<p id=show n=2>start</p>
<div n=3 worm="round"><ol><li>apple<li>orange</ol></div>
<div n=4><p>1</p><p>2</p></div>
<div n=5 jam=boysenberry><span>c</span></div>
<div n=6><span n=30></span><span n=31></span><span n=32></span><span n=33></span><span n=34></span><span n=35></span><span n=36></span><span n=37></span><span n=38></span><span n=39></span></div>

<script>
// test mutation observers; this will be rather a bear.
try {
show = document.getElementById("show")
msg = "ok";
b = document.body;

/*
    record the change that was made in a log. The order of mutation records
    isn't defined so we can use sets for easier comparison and extraction of
    mismatching records.
*/
log = new Set();
function nodeString(t) {
let s = null;
if(t.nodeType == 1) s = t.getAttribute('n');
if(s) return s;
if(t.nodeType == 3) return `"${t.data}"`;
return t.nodeName ? t.nodeName : t.toString();
}

const generalCallback = (mutationList, observer) => {
      for (const m of mutationList) {
let entry = `{${nodeString(m.target)}:`;
        if (m.type === "childList") {
if(m.previousSibling) entry += `~${nodeString(m.previousSibling)}`
            entry += "[";
if(m.removedNodes) {
for(let c of m.removedNodes) entry += `${nodeString(c)},`
entry = entry.replace(/,$/, "");
}
entry += ']';
if(m.nextSibling) entry += `${nodeString(m.nextSibling)}~`
entry += '>[';
if(m.addedNodes) {
for(let c of m.addedNodes) entry += `${nodeString(c)},`
entry = entry.replace(/,$/, "");
}
entry += ']';
        } else if (m.type === "attributes") {
            entry += `${m.attributeName}=${m.oldValue}>${m.target.getAttribute(m.attributeName)}`
        } else if (m.type === "characterData") {
            entry += `character=${m.oldValue}>${m.target.data}`
        }
        entry += "}";
        let count = 0;
        let entry2;
        do {
            ++count;
            entry2 = `${entry}(${count})`; 
        } while(log.has(entry2));
        log.add(entry2);
    }
};

// everything and subtree
const config_all = { attributes: true, childList: true, subtree: true , characterData: true, attributeOldValue:true, characterDataOldValue: true};
// without the subtree
const config_shallow = { attributes: true, childList: true, characterData: true, attributeOldValue:true, characterDataOldValue: true};
const ob1 = new MutationObserver(generalCallback);
const ob2 = new MutationObserver(generalCallback);

        ob1.observe(b, config_all);
// at this point we're watching...

function makeNode(n) { return b.querySelector(`[n="${n}"]`); }
node2 = makeNode(2);
node3 = makeNode(3);
node4 = makeNode(4);
node5 = makeNode(5);
node6 = makeNode(6);

/* start simple, setAttribute, change the kind of worm, it should be the first entry in the log.
Should generate {3:worm=round>flat}
3 because we are in node 3, attribute worm, oldValue is enabled so we see
the old value, round, and then the new value, flat. */
node3.setAttribute("worm", "flat")

// observe node3 but nothing below.
        ob2.observe(node3, config_shallow);
// If we add something to the list, div won't see it,
// because it is not a direct child, but body will, because it has subtree set.
banana = document.createElement("li");
banana.textContent = "banana";
ol = b.querySelector("ol");
ol.appendChild(banana);
// but if I add something directly under div, then both observers should see it.
// The same entry in the log twice.
node3.insertBefore(document.createElement("blockquote"), ol);
/* If I had ob1 watch both targets, body and div,
not 2 observers but 1, then the entry would not be duplicated.
Just one mutation record for the inserted node.
In that case, observing div is completely pointless,
as it is inside a subtree already being observed.
But for this test I used a second observer.
The order of these "observations" is not prescribed,
and could be different for chrome and edbrowse.
We'll deal with that later, when we analyze the log for correctness. */

// replace 2 paragraphs with 3 spans.
// This should make just one record.
node4.innerHTML = "<span>a</span><span jkl=23>b</span><span>c</span>";
// take out the last span
node4.removeChild(node4.lastChild);
// appendChild sometimes implies a removeChild
node4.appendChild(node5.firstChild);

/* append() is complicated. Nodes can be removed from all over the tree,
  but are all added to one destination.
Ans some of those nodes might be fragments, whence the contents
of the fragments are transferred.
How does this all play out with the records?
That's what we're going to find out. */
frag = document.createDocumentFragment();
span = document.createElement("span");
span.setAttribute("n", 40);
frag.appendChild(span);
span = document.createElement("span");
span.setAttribute("n", 41);
frag.appendChild(span);
node4.append(makeNode(33), makeNode(37), frag, makeNode(30));
span = document.createElement("span");
span.setAttribute("n", 42);
node42 = span;
frag.appendChild(span);
span = document.createElement("span");
span.setAttribute("n", 43);
frag.appendChild(span);
node4.prepend(makeNode(34), makeNode(38), frag, makeNode(31));
node42.before(makeNode(39));
node42.after(makeNode(32), "zz");
node42.replaceWith(makeNode(35), "yy", makeNode(36));
//make sure everything in node4 is in the right order.
let h = "";
for(let i = 0; i < node4.childNodes.length; ++i) {
const c = node4.childNodes[i];
if(c.nodeType == 3) h += c.data; else if(c.firstChild) h += c.firstChild.data; else h += c.getAttribute('n');
}
if(h != "34383935yy3632zz4331abc3337404130") msg += `|nodes ${h} are in the wrong order`;

// apendChild(frag) calls a special routine
span = document.createElement("span");
span.textContent = "Alaska ";
frag.appendChild(span);
span = document.createElement("span");
span.textContent = "Hawaii";
frag.appendChild(span);
node6.appendChild(frag);
if(node6.textContent != "Alaska Hawaii") msg += "|bad appendChild(frag)";

// create and remove an attribute.
node5.setAttribute("r@*s", "cat dog");
node5.removeAttribute("jam");
// We should be monitoring nodes that were added after the observor.
node43 = makeNode(43);
node43.setAttribute("tick", "tock");
// and not nodes that are removed
node42.setAttribute("up", "down");
// 42 is disconnected from the tree, still monitored,
// add another node below this one.
node42.appendChild(document.createTextNode("tomorrow"));
/* character data update.
Note that Text.data has no spillup or spilldown -
it's not clear that Text has an attribute system at all.
characterData is triggered by accessing data directly. Like this. */
node42.firstChild.data = "yesterday";

/* log is still empty, because these observers run asynchronously.
change it to middle so we know we got this far.
The timer will fire in half a second and overwrite it.
Still, this innerHTML changes the child under the show paragraph,
so the almost last entry in the log will be {2:["start"]>["mid"]}
text node with start is gone and now a text node with mid. */
show.innerHTML = "mid";
if(log.size) msg += "|observers ran during the script";

// finally set a timer so all these observers can run asynchronously
setTimeout(()=>{
// according to chrome and its upstream chromium
correct = new Set([
    '{3:worm=round>flat}(1)',
    '{OL:~LI[]>[LI]}(1)',
    '{3:[]OL~>[BLOCKQUOTE]}(1)',
    '{4:[P,P]>[SPAN,SPAN,SPAN]}(1)',
    '{4:~SPAN[SPAN]>[]}(1)',
    '{5:[SPAN]>[]}(1)',
    '{4:~SPAN[]>[SPAN]}(1)',
    '{6:~32[33]34~>[]}(1)',
    '{6:~36[37]38~>[]}(1)',
    '{6:[30]31~>[]}(1)',
    '{4:~SPAN[]>[33,37,40,41,30]}(1)',
    '{6:~32[34]35~>[]}(1)',
    '{6:~36[38]39~>[]}(1)',
    '{6:[31]32~>[]}(1)',
    '{4:[]SPAN~>[34,38,42,43,31]}(1)',
    '{6:~36[39]>[]}(1)',
    '{4:~38[]42~>[39]}(1)',
    '{6:[32]35~>[]}(1)',
    '{4:~42[]43~>[32,"zz"]}(1)',
    '{6:[35]36~>[]}(1)',
    '{6:[36]>[]}(1)',
    '{4:~39[42]32~>[35,"yy",36]}(1)',
    '{6:[]>[SPAN,SPAN]}(1)',
    '{5:r@*s=null>cat dog}(1)',
    '{5:jam=boysenberry>null}(1)',
    '{43:tick=null>tock}(1)',
    '{42:up=null>down}(1)',
    '{42:[]>["yesterday"]}(1)',
    '{"yesterday":character=tomorrow>yesterday}(1)',
    '{2:["start"]>["mid"]}(1)',
    '{3:[]OL~>[BLOCKQUOTE]}(2)',
    '{1:~SCRIPT[]>[HR]}(1)',
    '{1:~HR[]>[TEMPLATE]}(1)'
]);
const success = !log.symmetricDifference(correct).size;
if(!success) msg += "|rules don't match";
ob1.disconnect();
ob2.disconnect();
// make the rules one per line, for readability.
let output = "";
function addOutput(heading, entries)
{
    output += `<div><h2>${heading}</h2><ul>`;
    for (const e of entries) output += `<li>${e}</li>`;
    output += "</ul></div>"
}
if (!success) {
    addOutput("Extra entries in log", log.difference(correct));
    addOutput("Missing entries in log", correct.difference(log));
}
addOutput("Log", log);
if(!success) addOutput("Should be", correct);
show.innerHTML = `${msg}<br>${output}`;
}, 600);

} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}

/* As mentioned above, the records produced herein are not the entire log.
The next tag, <hr>, after script, is added to the tree,
and yes this addition is observed.
The new tag shows up as [HR], because I didn't give it an n value.
so it will look like {1:~SCRIPT[]>[HR]}.
Between the script tag and end of file comes HR.
But there's more, a distinct difference between chrome and edbrowse.
Chrome adds the bits of whitespace between tags. We don't.
So if I have <hr> on it's own line, there's whitespace
before and after it, two entries that edbrowse doesn't produce.
The fact that we don't put in these whitespace separators is very old,
and I don't know how easy it would be to change.
It matters in acid test 0, right out of the gate,
and I had to tweak it to pass.
But I've never seen it matter anywhere else.
Well I'm going to tweak this test as well -
leave no whitespace before or after <hr>,
so that chrome and edbrowse can produce exactly the same log.
That's what it means to pass the test.
Even more bizarre, I had to get rid of the newline at the end of this file -
even that turned into a whitespace node which was added to the tree.
So if you edit this, don't let your editor put a newline at the end.
edbrowse won't - unless you muck with the last line. */
</script><hr extra=tag><template><div><p>Shouldn't be logged</p></div></template></body>
