<head><title>Range Test</title></head>
<body>
<p id=show>start</p><p>1</p><p>2</p><p>3</p><p>4</p>
<script>
// Range tests, lots of cases here.
try {
msg = "ok";
b = document.body;
function check(condition, s) { if(!condition) msg += ` | ${s}`; }

range = new Range();
check((range == ""), "default range string");
check((range.commonAncestorContainer == document), "default range ancestor");
range.setStart(b, 0);
range.setEnd(b, 0);
check((range == ""), "body range string");
check((range.commonAncestorContainer == b), "body range ancestor");

para = b.querySelectorAll("p");
range.setStart(para[1], 0);
range.setEnd(para[4], 0);
check((range == "123"), "123 range string");
check((range.commonAncestorContainer == b), "123 range ancestor");

// check liveness
p5 = document.createElement("p");
p5.textContent = "5";
b.insertBefore(p5, para[3]);
check((para.length == 5), "querySelectorAll static");
check((range == "1253"), "1253 range string");
p5.remove();

// one side document, make it the left side so we don't have to encompass this script.
range.setStart(document, 0);
// once again I have to allow for differing whitespace between
// chrome and edbrowse.
check(/^Range Test\s*start *123$/.test(range), "doc4 range string");
check((range.commonAncestorContainer == document), "doc4 range ancestor");
range.setStart(b, 0);
check(/^\s*start *123$/.test(range), "body4 range string");
check((range.commonAncestorContainer == b), "body4 range ancestor");
range.setStart(para[1].firstChild, 0);
range.setEnd(para[4].firstChild, 0);
check((range == "123"), "text text range string");
check((range.commonAncestorContainer == b), "text text range ancestor");
range.setEnd(para[1].firstChild, 0);
check((range.commonAncestorContainer == para[1].firstChild), "text alone range ancestor");

frag = document.createDocumentFragment();
frag.appendChild(document.createElement("p"));
frag.appendChild(document.createElement("p"));
frag.appendChild(document.createElement("p"));
frag.appendChild(document.createElement("p"));
fpara = frag.querySelectorAll("p");
fpara[0].textContent = "a";
fpara[1].textContent = "b";
fpara[2].textContent = "c";
fpara[3].textContent = "d";
range.setStart(fpara[1], 0);
range.setEnd(fpara[3], 0);
check((range == "bc"), "bc range string");
check((range.commonAncestorContainer == frag), "bc range ancestor");
range.setStart(frag, 0);
check((range == "abc"), "abc range string");
check((range.commonAncestorContainer == frag), "abc range ancestor");
s5 = document.createElement("script");
s5.text = "xyz = 999";
frag.insertBefore(s5, fpara[2]);
// script won't run, it's not rooted, but it is there
check((range == "abxyz = 999c"), "xyz = 999 range string");
s5.remove();

// setStart something unrelated
range.setStart(p5, 0);
check((range == ""), "disconnected range string");
check((range.commonAncestorContainer == p5), "disconnected range ancestor");

// offsets into text nodes
fpara[0].textContent = "dog";
fpara[1].textContent = "cat";
fpara[2].textContent = "bird";
fpara[3].textContent = "turtle";
range.setStart(fpara[0].firstChild, 2);
range.setEnd(fpara[3].firstChild, 4);
check((range == "gcatbirdturt"), "catbird range string");
check((range.commonAncestorContainer == frag), "catbird range ancestor");
fpara[1].textContent = "cow";
check((range == "gcowbirdturt"), "cowbird range string");
fpara[1].firstChild.data = "horse";
check((range == "ghorsebirdturt"), "horsebird range string");
range.setStart(fpara[3].firstChild, 2);
check((range == "rt"), "rt range string");
check((range.commonAncestorContainer == fpara[3].firstChild), "rt range ancestor");

// check for offset nonzero under nodes and the many other instance methods...

show.textContent = msg;
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
