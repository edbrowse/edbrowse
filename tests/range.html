<head><title>Range Test</title></head>
<body>
<p id=show>start</p><p>1</p><p>2</p><p>3</p><p>4</p>
<script>
// Range tests, lots of cases here.
// There are more range tests in acid3, but I test for different stuff here.
try {
msg = "ok";
b = document.body;
function check(condition, s) { if(!condition) msg += ` | ${s}`; }

range = new Range();
check((range == ""), "default range string");
check((range.commonAncestorContainer == document), "default range ancestor");
range.setStart(b, 0);
range.setEnd(b, 0);
check((range == ""), "body range string");
check((range.commonAncestorContainer == b), "body range ancestor");
check((range.collapsed), "body collapsed");

para = b.querySelectorAll("p");
range.setStart(para[1], 0);
range.setEnd(para[4], 0);
check((range == "123"), "123 range string");
check((range.commonAncestorContainer == b), "123 range ancestor");
check((!range.collapsed), "123 not collapsed");

r2 = new Range;
r2.setStart(b, 0);
r2.setEnd(para[4], 0);
check((range.compareBoundaryPoints(range.START_TO_START, r2) == 1), "node start to start");
check((range.compareBoundaryPoints(range.START_TO_END, r2) == 1), "node start to end");
check((range.compareBoundaryPoints(range.END_TO_START, r2) == -1), "node end to start");
check((range.compareBoundaryPoints(range.END_TO_END, r2) == 0), "node end to end");

// compare the same text node, using offsets
text = new Text("abcdefghijklmnop");
r1 = new Range();
r1.setStart(text, 1);
r1.setEnd(text, 6);
r2.setStart(text, 1);
r2.setEnd(text, 4);
check((r1.compareBoundaryPoints(r1.START_TO_START, r2) == 0), "offset start to start");
check((r1.compareBoundaryPoints(r1.START_TO_END, r2) == 1), "offset start to end");
check((r1.compareBoundaryPoints(r1.END_TO_START, r2) == -1), "offset end to start");
check((r1.compareBoundaryPoints(r1.END_TO_END, r2) == 1), "offset end to end");

cmt = document.createComment("abcdefghijklmnop");
r1.setStart(cmt, 1);
r1.setEnd(cmt, 6);
check((r1 == ""), "part of comment");
cc = r1.cloneContents();
check((cc.nodeType == 11), "clone comment fragment");
check((cc.childNodes.length == 1), "clone comment");
check((cc.firstChild.nodeType == 8), "clone comment node");
check((cc.firstChild.data == "bcdef"), "clone comment string");
r1.deleteContents();
check((cmt.data == "aghijklmnop"), "bcdef deleted");

// check liveness
p5 = document.createElement("p");
p5.textContent = "5";
// comments don't appear in toString
p5.appendChild(document.createComment("dragon"));
b.insertBefore(p5, para[3]);
check((para.length == 5), "querySelectorAll static");
check((range == "1253"), "1253 range string");
p5.remove();

// one side document, make it the left side so we don't have to encompass this script.
range.setStart(document, 0);
// once again I have to allow for differing whitespace between
// chrome and edbrowse.
check(/^Range Test\s*start *123$/.test(range), "doc4 range string");
check((range.commonAncestorContainer == document), "doc4 range ancestor");
range.setStart(b, 0);
check(/^\s*start *123$/.test(range), "body4 range string");
check((range.commonAncestorContainer == b), "body4 range ancestor");
check((range.startContainer == b), "body4 startContainer");
check((range.endContainer == para[4]), "body4 endContainer");
check((range.startOffset == 0), "body4 startOffset");

cc = range.cloneContents();
check((cc.nodeType == 11), "clone body4 fragment");
check(/^\s*start *123$/.test(cc.textContent), "clone body4 string");

check((range.endOffset == 0), "body4 endOffset");
range.setStart(para[1].firstChild, 0);
range.setEnd(para[4].firstChild, 0);
check((range == "123"), "text text range string");
check((range.commonAncestorContainer == b), "text text range ancestor");
range.setEnd(para[1].firstChild, 0);
check((range.collapsed), "text alone collapsed");
check((range.commonAncestorContainer == para[1].firstChild), "text alone range ancestor");

frag = document.createDocumentFragment();
frag.appendChild(document.createElement("p"));
frag.appendChild(document.createElement("p"));
frag.appendChild(document.createElement("p"));
frag.appendChild(document.createElement("p"));
fpara = frag.querySelectorAll("p");
fpara[0].textContent = "a";
fpara[1].textContent = "b";
fpara[2].textContent = "c";
fpara[3].textContent = "d";
range.setStart(fpara[1], 0);
range.setEnd(fpara[3], 0);
check((range == "bc"), "bc range string");
check((range.commonAncestorContainer == frag), "bc range ancestor");
range.setStart(frag, 0);
check((range == "abc"), "abc range string");
check((range.commonAncestorContainer == frag), "abc range ancestor");
s5 = document.createElement("script");
s5.text = "xyz = 999";
frag.insertBefore(s5, fpara[2]);
// script won't run, it's not rooted, but it is there
check((range == "abxyz = 999c"), "xyz = 999 range string");
s5.remove();

// setStart something unrelated
range.setStart(p5, 0);
check((range.collapsed), "disconnected collapsed");
check((range == ""), "disconnected range string");
check((range.commonAncestorContainer == p5), "disconnected range ancestor");

// offsets into text nodes
fpara[0].textContent = "dog";
fpara[1].textContent = "cat";
fpara[2].textContent = "bird";
fpara[3].textContent = "turtle";
range.setStart(fpara[0].firstChild, 2);
range.setEnd(fpara[3].firstChild, 4);
check((range == "gcatbirdturt"), "catbird range string");
check((range.commonAncestorContainer == frag), "catbird range ancestor");
check((range.startContainer == fpara[0].firstChild), "catbird startContainer");
check((range.endContainer == fpara[3].firstChild), "catbird endContainer");
check((range.startOffset == 2), "catbird startOffset");
check((range.endOffset == 4), "catbird endOffset");

r2 = range.cloneRange();
check((r2.startContainer == fpara[0].firstChild), "r2 startContainer");
check((r2.endContainer == fpara[3].firstChild), "r2 endContainer");
check((r2.startOffset == 2), "r2 startOffset");
check((r2.endOffset == 4), "r2 endOffset");

frag.appendChild(p5);
fpara[3].appendChild(document.createTextNode("flower"));
// p5 and flower should not carry along with the clone
fpara[1].setAttribute("jj", 99);
fpara[1].style.marginTop = "9px";
cc = range.cloneContents();
p5.remove();
check((cc.nodeType == 11), "clone type fragment");
check((cc.childNodes.length == 4), "clone 4 kids");
check((cc.lastChild.childNodes.length == 1), "clone no flower");
check((cc.childNodes[1].getAttribute("jj") == 99), "clone jj = 99");
check((cc.childNodes[1].style.getPropertyValue("margin-top") == "9px"), "clone marginTop = 9px");
check((cc.textContent == "gcatbirdturt"), "clone gcatbirdturt");

// change the second animal in two ways
fpara[1].textContent = "cow";
check((range == "gcowbirdturt"), "cowbird range string");
fpara[1].firstChild.data = "horse";
check((range == "ghorsebirdturt"), "horsebird range string");
range.setStart(fpara[3].firstChild, 2);
check((range == "rt"), "rt range string");
check((!range.collapsed), "rt not collapsed");
check((range.commonAncestorContainer == fpara[3].firstChild), "rt range ancestor");

cc = range.cloneContents();
check((cc.nodeType == 11), "clone rt fragment");
check((cc.childNodes.length == 1), "clone rt 1 child");
check((cc.firstChild.data == "rt"), "clone rt string");

r2.setStart(text, 3);
r2.setEnd(text, 8);
r2.deleteContents();
check((text.data == "abcijklmnop"), "delete defgh");
check((r2.endOffset == 3), "offset from 8 to 3");
// a more copmlicated delete
div = document.createElement("div");
div.innerHTML = "<p><i>cat</i>paragraph 1<i>dog</i></p><p>paragraph 2</p><p>paragraph 3</p>";
r2.setStart(div.firstChild.firstChild.nextSibling, 4);
r2.setEnd(div.lastChild.lastChild, 4);
r2.deleteContents();
check((div.textContent == "catparagraph 3"), "delete paragraph");
check(r2.collapsed, "delete collapse");
// make sure form keeps up with the changes
div.innerHTML = "<form><input name=a><input name=b><br><input name=c><input name=d><input type=submit></form>";
form = div.firstChild;
r2.setStart(form.b, 0);
r2.setEnd(form.d, 0);
inputc = form.c;
cc = r2.extractContents();
check((form.a && form.b && form.d), "a b and d persist");
check((!form.c), "c goes away");
check((form.elements.length == 4 && form.a == form.elements[0] && form.d == form.elements[2]), "form.elements");
check((form.childNodes.length == 4), "4 children persist");
check((cc.childNodes.length == 4), "4 elements extracted");
check((cc.firstChild.name == 'b' && cc.lastChild.name == 'd'), "b c and d extracted");
check((cc.childNodes[2] == inputc), "input c moves and is not cloned");
check((!cc.b), "clone form is not a form");

r2.setStart(form, 0);
r2.insertNode(document.createElement("hr"));
check((form.firstChild.nodeName == "HR"), "leading hr");
r2.insertNode(document.createTextNode("elephant"));
check((form.firstChild.nodeType == 3), "leading text");
r2.setStart(form.firstChild, 3);
r2.insertNode(document.createTextNode("glass"));
check((r2.startOffset == 3), "offset advances to 3");
// in chrome, end changes from form.d to form offset 6
// I don't know if that's specifically because of split text,
// or if we should do the same.
check((form.firstChild.data == "ele"), "ele");
check((form.firstChild.nextSibling.data == "glass"), "glass");
check((form.firstChild.nextSibling.nextSibling.data == "phant"), "phant");

// play with some node offsets
r2.setStart(form, 1);
r2.setEnd(form, 2);
check((!r2.collapsed), "glass not collapsed");
check((r2 == "glass"), "glass string");
r2.setStart(form, 2);
r2.setEnd(form, 5);
check((r2 == "phant"), "phant string");
cc = r2.cloneContents();
// This is completely whack! When set by offset, the last node is not cloned -
// when set directly, that last node is cloned.
// That's what chrome does and I have to figure out how to simulate it.
check((cc.childNodes.length == 3), "phant offset length 3");
check((cc.lastChild.name == 'a'), "phant offset name a");
r2.setEnd(form.childNodes[5], 0);
cc = r2.cloneContents();
check((cc.childNodes.length == 4), "phant direct length 4");
check((cc.lastChild.name == 'b'), "phant direct name b");
// This may explain the whackiness. offset can be set after the end
// of the array, thus not pointing to a real node.
r2.setEnd(form, 8);
cc = r2.cloneContents();
check((cc.childNodes.length == 6), "phant limit length 6");
check((cc.lastChild.type == 'submit'), "phant limit type submit");

// delete up to the end marker, not the end tag.
r2.deleteContents();
check((r2.startContainer == form), "delete marker start form");
check((r2.startOffset == 2), "delete marker start 2");
check((r2.endContainer == form), "delete marker end form");
check((r2.endOffset == 2), "delete marker end 2");
check(r2.collapsed, "delete marker collapsed");
check((form.childNodes.length == 2), "delete marker form leaves 2");
check((form.elements.length == 0), "delete marker form elements gone");

// surround three adjacent nodes
div.innerHTML = "a<br>b<br>c<br>d<br>e";
r2.setStart(div, 2);
r2.setEnd(div, 5);
amid = document.createElement("a");
r2.surroundContents(amid);
check((div.childNodes.length == 7), "div length 7");
check((amid.childNodes.length == 3), "amid length 3");
check((amid.parentNode == div), "div parent of amid");
check((div.textContent == "abcde"), "div content abcde");
check((amid.textContent == "bc"), "amid content bc");
div.innerHTML = "<p>hot<br>cold</p>";
r2.selectNode(div.firstChild);
amid = document.createElement("a");
r2.surroundContents(amid);
check((div.childNodes.length == 1), "div length 1");
check((amid.childNodes.length == 1), "amid length 1");
check((amid.parentNode == div), "div parent of amid");
check((amid.textContent == "hotcold"), "amid content hotcold");
check((r2.startContainer == div), "r2.start is still div");
check((r2.endContainer == div), "r2.end is still div");
check((r2.endOffset == 1), "r2.end offset is 1");
div.textContent = "hork snork";
r2.setStart(div.firstChild, 1);
r2.setEnd(div.firstChild, 9);
amid = document.createElement("a");
r2.surroundContents(amid);
check((div.textContent == "hork snork"), "content still hork snork");
check((div.childNodes.length == 3), "hork div length 3");
check((div.firstChild.data == 'h' && div.lastChild.data == 'k' && amid.firstChild.data == "ork snor"), "hork in 3 pieces");
check((r2.startContainer == div && r2.endContainer == div), "hork range still div");
check((r2.startOffset == 1 && r2.endOffset == 2), "hork range now 1 and 2");

// deeper tree to verify inside outside
div.innerHTML = "<p>a<p>1<p>g<br>h</p>2</p>b<p>3<p>i<br>j</p>4</p></p>"
brlist = div.querySelectorAll("br");
r2.setStart(brlist[0], 0);
r2.setEnd(brlist[1], 0);
check((r2 == "h2b3i"), "inside h2b3i");

c1 = document.createComment("1");
c2 = document.createComment("2");
c3 = document.createComment("3");
r1 = new Range;
r1.insertNode(c1);
r1.insertNode(c2);
r1.setStart(r1.startContainer, r1.startOffset + 1);
r1.insertNode(c3);
check((document.firstChild == c2 && document.childNodes[1] == c3 && document.childNodes[2] == c1), "comments order 231");
c1.remove(), c2.remove(), c3.remove(); // clean up
check((document.firstChild == document.documentElement), "back to documentElement");

// mutations in the tree, as they affect ranges.
// acid test 13 is one such test but there are dozens of other combinations.
div.innerHTML = "<br><br><br><br><br><br>";
r1.setStart(div, 1);
r1.setEnd(div, 5);
hr = document.createElement("hr");
div.insertBefore(hr, div.childNodes[1]);
check((r1.startOffset == 1 && r1.endOffset ==  6), "offsets add hr 1");
hr.remove();
check((r1.startOffset == 1 && r1.endOffset ==  5), "offsets remove hr 1");
div.insertBefore(hr, div.childNodes[5]);
check((r1.startOffset == 1 && r1.endOffset ==  5), "offsets add hr 5");
hr.remove();
check((r1.startOffset == 1 && r1.endOffset ==  5), "offsets remove hr 5");
div.textContent = "gone";
check((r1.startContainer == div && r1.endContainer ==  div), "containers gone");
check((r1.startOffset == 0 && r1.endOffset ==  0), "offsets gone");
div.innerHTML = "<br><br><br><br><br><p>hello</p>";
r1.setStart(div, 1);
r1.setEnd(div.lastChild, 0);
div.insertBefore(hr, div.childNodes[1]);
check((r1.startOffset == 1 && r1.endContainer == div.lastChild), "add hr 1 1 p");
r1.setEnd(div.lastChild.lastChild, 0);
hr.remove();
check((r1.startOffset == 1 && r1.endContainer == div.lastChild.lastChild), "remove hr 1 1 text");
div.lastChild.remove();
check((r1.startOffset == 1 && r1.endContainer == div && r1.endOffset == 5), "remove p 1 5");
r1.selectNodeContents(div);
div.appendChild(hr);
check((r1.startOffset == 0 && r1.endContainer == div && r1.endOffset == 5), "append hr 0 5");
div.innerHTML = "<br><p>hello</p><br><p>goodbye</p><br>";
ph = div.childNodes[1];
pg = div.childNodes[3];
r1.setStart(ph, 0);
r1.setEnd(pg, 0);
ph.remove();
check((r1.startContainer == div && r1.startOffset == 1), "remove hello start");
check((r1.endContainer == pg && r1.endOffset == 0), "remove hello end");
div.insertBefore(ph, div.childNodes[1]);
check((r1.startOffset == 1), "ph putback offset 1");
r1.setStart(ph.firstChild, 0);
r1.setEnd(pg.firstChild, 0);
pg.remove();
check((r1.startContainer == ph.firstChild && r1.startOffset == 0), "remove goodbye start");
check((r1.endContainer == div && r1.endOffset == 3), "remove goodbye end");
ph.firstChild.remove();
check((r1.startContainer == ph && r1.startOffset == 0), "remove hello text start");
check((r1.endContainer == div && r1.endOffset == 3), "remove hello text end");
div.appendChild(pg);
r1.setEnd(pg, 0);
div.textContent = "gone";
check((r1.startContainer == div && r1.endContainer ==  div), "containers gone2");
check((r1.startOffset == 0 && r1.endOffset ==  0), "offsets gone2");
div.innerHTML = "<br><br><br>";
r1.setStart(div, 1);
r1.setEnd(div.lastChild, 0);
div.textContent = "gone";
check((r1.startContainer == div && r1.endContainer ==  div), "containers gone3");
check((r1.startOffset == 0 && r1.endOffset ==  0), "offsets gone3");
div.innerHTML = "<p></p><p>a<br>b</p>";
ph = div.firstChild, pg = div.lastChild;
r1.setStart(ph, 0);
r1.setEnd(pg, 1);
pg.insertBefore(hr, pg.childNodes[0]);
check((r1.startContainer == ph && r1.startOffset == 0), "pg hr start");
check((r1.endContainer == pg && r1.endOffset == 2), "pg hr end");
check((r1.commonAncestorContainer == div), "pg hr ancestor");
r1.deleteContents();
check((r1.startContainer == div && r1.startOffset == 1), "delcon start");
check((r1.endContainer == div && r1.endOffset == 1), "delcon end");
check((r1.commonAncestorContainer == div), "delcon ancestor");
check((div.firstChild == ph && div.lastChild == pg), "ph and pg still there");
// by offset deletes the first node
r1.setStart(div, 0);
r1.deleteContents();
// leaves the same range as extractContents
check((r1.startContainer == div && r1.startOffset == 0), "delcon by offset start");
check((r1.endContainer == div && r1.endOffset == 0), "delcon by offset end");
check((r1.commonAncestorContainer == div), "delcon by offset ancestor");
check((div.childNodes.length == 1 && div.lastChild == pg), "only pg remains");
div.appendChild(ph);
r1.selectNodeContents(div);
r1.deleteContents();
// leaves the same range as extractContents
check((r1.startContainer == div && r1.startOffset == 0), "delcon by select start");
check((r1.endContainer == div && r1.endOffset == 0), "delcon by select end");

show.textContent = msg;
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
