<head></head>
<body>
<p id=show>start</p>
<p>first paragraph
<script defer>
// set these scripts to defor or async it doesn't matter, because they are inline
var p = document.createElement("p");
p.appendChild(document.createTextNode("second paragraph"));
document.body.appendChild(p);
</script>
<p>third paragraph</p>
<script>
(function () {
        var e = document.currentScript
e.remove();
document.write("<p>fourth paragraph</p>");
    })();
</script>
<p>fifth paragraph</p>
<script>
show = document.getElementById("show")
try {
let h = ""
for(let i = 1; i <= 5; ++i)
h += document.body.children[i].firstChild.data.substr(0,2);
if(h == "fisethfofi") show.innerHTML = "ok";
else show.innerHTML = `ok|bad order ${h}`
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
</body>
