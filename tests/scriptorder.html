<body>
<p id=show>start</p>
<div id=hs></div>
<script src=scriptord1.js defer></script>
<script>
// Test the order in which scrips run.
// This proves script execution is reentrant.
try {
show = document.getElementById("show")
b = document.body
h = "a";
s = document.createElement("script")
s.text = "h += 'b'"
b.appendChild(s); // runs right now
h += 'c';
div = document.getElementById("hs")
// remember that the closing script tag can never appear, even in a string -
// until you are really ready to close the script.
div.innerHTML = "<script>h += 'd'<" + "/script>"
if(div.firstChild.nodeName != "SCRIPT") h += "x";
// the script produced by innerHTML doesn't run. I don't know why!
// So we have implemented same.
// d will not appear in the string h.
h += 'e';
document.write("<hr><script> h += 'f'<" + "/script>") // runs right now
// document write puts nodes adjacent at the same level
if(!s.nextSibling || s.nextSibling.nodeName != "HR") h += 'x'
h += 'g'
// this one is deferred probably because it is src
document.write("<script src=scriptord2.js> <" + "/script>")
h += 'h'
// indicate we are in the middle and the timer hasn't run yet
show.innerHTML = "mid"
// set a timer in case that innerHTML script ran later
// And to accommodate the src scripts deferred
setTimeout(()=>{
if(h == "abcefghiz") show.innerHTML = "ok";
else show.innerHTML = "ok|bad order " + h}, 600)
} catch(e) { show.innerHTML = "blowup " + e;}
</script>
