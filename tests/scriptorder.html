<head><script> h = "a"; on_css_load = false; </script>
<LINK href="sample.css" rel=stylesheet type=text/css onload="on_css_load = true">
</head>
<body onload="h += 'l' + arguments[0].eventPhase">
<p id="show">start</p>
<div id="hs"></div>
<script id=last src=scriptord1.js defer onload="h += 'y'"></script>
<script>
// Test the order in which scrips run.
// This proves script execution is reentrant.
try {
show = document.getElementById("show")
b = document.body
s = document.createElement("script")
s.text = "h += 'b'"
b.appendChild(s); // runs right now
h += 'c';
div = document.getElementById("hs")
// remember that the closing script tag can never appear, even in a string -
// until you are really ready to close the script.
div.innerHTML = "<script>h += 'd'<" + "/script>"
if(div.firstChild.nodeName != "SCRIPT") h += "@1";
// the script produced by innerHTML doesn't run. I don't know why!
// d will not appear in the string h.
h += 'e';
// Always write html that is complete, so it triggers dw_flush_conditional
document.write("<ol><li>apple<li>orange<li>lemon</ol>")
// document write puts nodes adjacent at the same level
if(!s.nextSibling || s.nextSibling.nodeName != "OL") h += "@2"
// write a complete script, which is evaluated now
document.write(" <script> h += 'f'<" + "/script> ")
h += 'g'
// this one is deferred probably because it is remote
document.write("<script src=scriptord2.js> <" + "/script>")
h += 'h'

// put a couple of handlers on the scrip load. this is just a warmup -
// we need a file for testing events.
last = document.getElementById("last")
// order should be capture, fire, bubble. Thus xyw
// even though these are capture and bubble, the phase is 2
function handle_c(e) {
h += 'x'
if(e.target != last || e.currentTarget != last) h += "@4";
if(e.eventPhase != 2) h += "@5";
}
last.addEventListener("load", handle_c, true);
function handle_b(e) {
h += 'w'
if(e.target != last || e.currentTarget != last) h += "@4";
if(e.eventPhase != 2) h += "@5";
}
last.addEventListener("load", handle_b, false);
// adding it again does nothing
last.addEventListener("load", handle_b, false);

document.addEventListener("DOMContentLoaded", ()=>(h += "/j"));
document.addEventListener("readystatechange", ()=>{
if(document.readyState == "complete") h += 'k'; })
addEventListener("load", ()=>(h += 'm'));

// indicate we are in the middle and the timer hasn't run yet
show.innerHTML = "mid"

queueMicrotask(()=>{h += 's'});

setTimeout(()=>{h += "/t"}, 300);

// set a show timer in case that innerHTML script ran later
// And to accommodate the src scripts deferred and the microtask.
setTimeout(()=>{
if(this != window) h += "@6";
// I wanna fold the css onload function into the timing,
// but it fetches asynchronously in chrome, so I can't guarantee when it will happen.
// I'll just make sure it happened by now.
if(!on_css_load) h += '@3';
const correct = "abcefghsizxyw/jkl2m/t";
if(h == correct) show.innerHTML = "ok";
else show.innerHTML = `ok|bad order  ${h} should be ${correct}`}, 600)
} catch(e) { show.innerHTML = "blowup " + e;}
</script>
</body>
