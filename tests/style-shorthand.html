<head>
<title>Order of CSS properties</title>
<style>
body { padding-top: 5px; padding-left: 12px; }
p.before:before { box-sizing: border-box}
p.before:after { vertical-align: top}
p.before { font-family: helvetica; text-align: center; }
</style>
<link href="sample.css" rel=stylesheet type=text/css onload="on_css_load = true">
</head>
<body>
<p id=show>start</p>
<p id=items></p>
<h1 id=h1> heading </h1>
<div id="div1"    style="padding: 10px;
scroll-padding: 0 5px;
border-color: red;
border-radius: 0 5px;
border-style: solid;
border-width: 0 5px;
scroll-margin: 0 5px;
margin: 0 10px;
background-color: #ccaa11;
font-family:  monospace
"></div> 
<div id="div2"    style=" padding: 10px;
border: 5px solid red;
margin: 0 10px;
my-invalid-property: telephone;
background-color: #ccaa11;
background: bbb;
font-family:  monospace
"></div> 
<p class=before id=before></p>

<script> 
/* Warning! This runs fine in edbrowse, locally, but in chrome
we get a security blowup when accessing the rules for the css file.
This file and sample.css both have to be on a website, and accessed by:
http://www.edbrowse.org/style-shorthand.html
then the domains match and chrome is happy. */

try {
msg = "ok";
h = "";
b = document.body;
isedbrowse = navigator.userAgent.substr(0, 8) == "edbrowse";

for (let i = 1; i <= 2; i++) {
const id = "div" + i;
const myDiv = document.getElementById(id); 
const divStyle = myDiv.style; 
window.ds = divStyle;
const len = divStyle.length;
h += `${id}:${len}|`
for (let i = 0; i < len; i++)
h += divStyle.item(i) + "|";
}

document.getElementById("items").innerHTML = h.replace(/\|/g, "<br>");

const correct = "div1:34|padding-top|padding-right|padding-bottom|padding-left|scroll-padding-top|scroll-padding-right|scroll-padding-bottom|scroll-padding-left|border-top-color|border-right-color|border-bottom-color|border-left-color|border-top-left-radius|border-top-right-radius|border-bottom-right-radius|border-bottom-left-radius|border-top-style|border-right-style|border-bottom-style|border-left-style|border-top-width|border-right-width|border-bottom-width|border-left-width|scroll-margin-top|scroll-margin-right|scroll-margin-bottom|scroll-margin-left|margin-top|margin-right|margin-bottom|margin-left|background-color|font-family|div2:27|padding-top|padding-right|padding-bottom|padding-left|border-top-width|border-right-width|border-bottom-width|border-left-width|border-top-style|border-right-style|border-bottom-style|border-left-style|border-top-color|border-right-color|border-bottom-color|border-left-color|border-image-source|border-image-slice|border-image-width|border-image-outset|border-image-repeat|margin-top|margin-right|margin-bottom|margin-left|background-color|font-family|";
if(h != correct) msg += "|mismatch shorthand properties";
if(ds.item(1.3) != ds.item(1) || ds.item("blah") != ds.item(0) || ds.item(atob) != ds.item(0) || ds.item("7") != ds.item(7)) msg += "|bad style.item conversions";
// make sure it'snot really there
if(ds.myInvalidProperty) msg += "|invalid property present";

/* initial length is 0, because the style and css properties
on body don't kick in until getComputedStyle runs.
At that point they are all their, as they are converted from default empty
strings to appropriate default values, or brought in by style or css,
or calculated based on nodes up the chain, etc.
length on a getComputedStyle node will be huge, embrasing all the properties.
We're not gonna mess with that. */
if(b.style.length) msg += `|initial body style length ${b.style.length}`;
if(b.style.paddingTop !== "") msg += `|bad default padding ${b.style.paddingTop}`;
if(b.style.display !== "") msg += `|bad default display ${b.style.display}`;
if(b.style.color !== "") msg += `|bad default color ${b.style.color}`;
if(b.style.fontSize !== "") msg += `|bad default fontSize ${b.style.fontSize}`;
if(div1.style.paddingTop !== "10px") msg += `|bad html set padding ${b.style.paddingTop}`;
b.style.display = "block";
if(b.style.display !== "block") msg += `|bad direct set display ${b.style.display}`;

if(document.styleSheets.length != 2) msg += `|bad sync styleSheets count ${document.styleSheets.length}`;
sr1 = document.styleSheets[0].cssRules;
if(sr1.length != 4) msg += `|first sheet has ${sr1.length} rules`;
// edbrowse doesn't always have the same whitespace as chrome
if(!sr1[0].cssText.match(/^body { *padding-top: *5px; *padding-left: *12px; *}$/)) msg += `|bad div rule ${sr1[0].cssText}`;
sr2 = document.styleSheets[1].cssRules;
if(sr2.length != 5) msg += `|second sheet has ${sr2.length} rules`;
if(sr2[1].cssText.substr(0, 4) != "h1 {" || sr2[2].cssText.substr(0, 4) != "h2 {") msg += "|css rules 1 and 2 don't look like h1 h2";

p0 = document.createElement("p");
s0 = p0.style;
if(s0.length) msg += "|s0 has initial length";
// we already confirmed a getter rebuilds padding from its parts,
// make sure a setter splits padding into its parts, and not the
// intelligence of an instance method like cssText or setAttribute.
s0.padding = "6px 7px";
if(s0.length != 4) msg += `|padding length ${s0.length}`;
if(s0.paddingTop != "6px") msg += `|bad setter paddingTop ${s0.paddingTop}`;
if(s0.paddingRight != "7px") msg += `|bad setter paddingRight ${s0.paddingRight}`;
if(s0.item(3) != "padding-left") msg += `|bad item 3 ${s0.item(3)}`;
// directly set a simple property, not a composite
s0.scrollMarginTop = "9px";
if(s0.scrollMarginTop != "9px") msg += "|scrollMarginTop not 9px";
if(s0.length != 5 || s0.item(4) != "scroll-margin-top") msg += `|scrollMarginTop didn't append, length ${s0.length}`;
if(s0[2] != "padding-bottom" || s0[4] != "scroll-margin-top") msg += `|fail direct index on s0 ${s0[2]} ${s0[4]}`;
s0.removeProperty("padding-bottom");
// make sure things shifted down
if(s0.length != 4) msg += `|length didn't decrement ${s0.length}`;
if(s0[4] !== undefined) msg += "|index 4 didn't go away";
if(s0.cssText != "padding-top: 6px; padding-right: 7px; padding-left: 7px; scroll-margin-top: 9px;") msg += `|bad cssText after remove ${s0.cssText}`;
// put bottom back in - in the wrong order now
s0.setProperty("padding-bottom", "14px");
if(s0.length != 5 ||  s0[4] != "padding-bottom") msg += "|bottom didn't append";
if(s0.padding != "6px 7px 14px") msg += `|padding shorthand after bottom ${s0.padding}`;
if(s0.getPropertyValue("padding-bottom") != "14px") msg += `|bad get property ${s0.getPropertyValue("padding-bottom")}`;
if(s0.getPropertyValue("scroll-margin-left") !== "") msg += `|getProperty of missing ${s0.getPropertyValue("scroll-margin-left")}`;
// out of bounds
if(s0.item(17) !== "") msg += "|item 17 not empty string";
if(s0.getPropertyValue("cat") !== "") msg += "|cat not empty string";

s1 = getComputedStyle(b);
// 5px comes from our style tag
if(s1.paddingTop !== "5px") msg += `|bad s1 paddingTop ${s1.paddingTop}`;
// default "" becomes default 0px via getComputedStyle
if(s1.paddingRight !== "0px") msg += `|bad s1 padding right ${s1.paddingRight}`;
/* put a composite back together.
If I didn't specify padding-left in the style at the top of this page,
if paddingLeft and paddingRight were left alone at their default,
they would be equal, and chrome uses the shorthand 5px 0px 0px,
understanding that the second 0px for the right is copied to 0px on the left.
So tweak the test a little and force crome to spit out all 4 numbers.
edbrowse also spits out all 4 numbers, and they agree. */
if(s1.padding !== "5px 0px 0px 12px") msg += `|bad s1 padding composite ${s1.padding}`;
// I have since written the aroundGet functions, which do the same thing
// as chrome; let's test it out with all default values the same.
if(s1.borderRadius != "0px") msg += `|bad composite borderRadius ${s1.borderRadius}`;
if(s1.borderInline != "0px none rgb(255, 0, 0)") msg += `|bad composite borderInline ${s1.borderInline}`;
// our direct assignment carries through to s1
if(s1.display !== "block") msg += `|bad s1 display ${s1.display}`;
// color red comes from the css file
 if(s1.color !== "rgb(255, 0, 0)") msg += `|bad s1 color ${s1.color}`;
if(s1.backgroundColor !== "rgb(128, 128, 128)") msg += `|bad s1 backgroundColor ${s1.backgroundColor}`;
 if(s1.fontSize !== "20px") msg += `|bad s1 fontSize ${s1.fontSize}`;
if(s1.textAlign != "start") msg += `|bad align ${s1.textAlign}`;
if(s1.verticalAlign != "baseline") msg += `|bad valign ${s1.verticalAlign}`;
if(s1.zIndex != "auto") msg += `|bad zIndex ${s1.zIndex}`;
// invalid properties don't push through from css either.
if(s1.nonsense) msg += "|got nonsense from css";

sh1 = getComputedStyle(h1);
if(!isedbrowse) {
// we don't do all the up-the-chain calculations yet.
// 3.0em means 3 times what you already have, and body has set it at 125%.
// so body set size at 20px, and h1 should be 60px.  Maybe some day.
if(sh1.fontSize != "60px") msg += `|sh1 size ${sh1.fontSize}`;
}
if(sh1.color != "rgb(65, 105, 225)") msg += `|sh1 color ${sh1.color}`;

s2 = getComputedStyle(before);
if(s2.fontFamily != "helvetica") msg += `|fontFamily ${s2.fontFamily} on standard style`;
if(s2.boxSizing != "content-box") msg += `|boxSizing ${s2.boxSizing} on standard style`;
if(s2.textAlign != "center") msg += `|textAlign ${s2.textAlign} on standard style`;
if(s2.verticalAlign != "baseline") msg += `|verticalAlign ${s2.verticalAlign} on standard style`;

s3 = getComputedStyle(before, ":before");
if(s3.boxSizing != "border-box") msg += "|boxSizing not found on before style";
if(s3.fontFamily != "helvetica") msg += `|fontFamily ${s3.fontFamily} on before style`;
if(s3.textAlign != "center") msg += `|textAlign ${s3.textAlign} on before style`;

s4 = getComputedStyle(before, ":after");
if(s4.boxSizing != "content-box") msg += "|boxSizing not correct on after style";
if(s4.fontFamily != "helvetica") msg += `|fontFamily ${s4.fontFamily} on after style`;
if(s4.textAlign != "center") msg += `|textAlign ${s4.textAlign} on after style`;
if(s4.verticalAlign != "top") msg += `|verticalAlign ${s4.verticalAlign} on after style`;

show.innerHTML = msg;
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
</body>
