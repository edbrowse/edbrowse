<head></head><body>
<p id=show>start</p>

<table id=tab1>
<caption>modern stone-age</caption>
<tr><th>first</th><th>middle</th><th>last</th></tr>
<tr><td>fred</td><td>t</td><td>flintstone</td></tr>
<tr><td>wilma</td><td>p</td><td>flintstone</td></tr>
<tbody>
<tr><td>barney</td><td>l</td><td>rubble</td></tr>
<tr><td>betty</td><td>l</td><td>rubble</td></tr>
</tbody>
<tfoot>
<tr><td>joe</td><td>m</td><td>rockhead</td></tr>
</table>

<table id=tab2>
<thead>
<tr><th>first</th><th>middle</th><th>last</th></tr>
</thead>
<tr><td>fred</td><td>t</td><td>flintstone</td></tr>
<tr><td>wilma</td><td>p</td><td>flintstone</td></tr>
<tbody>
<tr><td>barney</td><td>l</td><td>rubble</td></tr>
<tr><td>betty</td><td>l</td><td>rubble</td></tr>
</tbody>
<tfoot>
<tr><td>joe</td><td>m</td><td>rockhead</td></tr>
</table>


<script>
// tables, rows, cells - a lot of stuff here.
try {
show = document.getElementById("show")
msg = "ok";
b = document.body;

tab = document.getElementById("tab1");
// A lot of structure is inferred from html.
// Such structure has to be built specifically in javascript.
// Rows are assumed to belong to a body. Then a new body comes along and that's ok.
tb = tab.tBodies;
if(tb.length != 2) msg += `|wrong body count ${tb.length}`;
if(tab.tHead) msg += "|unexpected head";
if(tb[0].rows.length != 3 || tb[1].rows.length != 2) msg += "|row count not 3+2";
if(tab.rows.length != 6) msg += `|total row count ${tab.rows.length}`;
if(tab.tFoot.rows.length != 1) msg += "|no rows in footer";
// skip past caption
body1 = tab.firstElementChild.nextElementSibling;
if(body1 != tab.tBodies[0]) msg += "|body not first tBodies";
body2 = tab.tBodies[1];
hrow = body1.firstElementChild; // head row though not properly tHead
if(hrow != tab.rows[0]) msg += "|head row not first in table";
if(hrow.cells.length != 3) msg += "|top row not 3 cells";
if(hrow.cells[0].nodeName != "TH") msg += "|top row not TH";
if(hrow.textContent != "firstmiddlelast") msg += "|wrong th text content";
hrow = body2.firstElementChild; // the barney row
if(hrow != tab.rows[3]) msg += "|barney row not fourth in table";
if(hrow != body2.rows[0]) msg += "|barney row not first in body2";
if(hrow.cells.length != 3) msg += "|barney row not 3 cells";
if(hrow.cells[0].nodeName != "TD") msg += "|barney row not TD";
if(hrow.textContent != "barneylrubble") msg += "|wrong td text content";
hrow = tab.tFoot.rows[0];
if(hrow != tab.rows[5]) msg += "|rockhead row not last in table";
if(hrow.cells[2].firstChild.data != "rockhead") msg += "|couldn't find rockhead";

// muck with the table dynamically. Everything should reindex.
if(tab.caption.firstChild.data != "modern stone-age") msg += "|bad caption";
tab.deleteCaption();
if(tab.caption) msg += "|caption property not gone";
if(tab.querySelector("caption")) msg += "|caption node not gone";
tab.createCaption();
tab.caption.textContent = "winston cigarettes";
if(tab.caption != tab.firstChild) msg += "|caption not first child";
// delete a cell, which makes it different from the other rows but that's ok
hrow.deleteCell(1);
if(hrow.cells.length != 2) msg += "|wrong cell count after delete";
if(hrow.cells[1].firstChild.data != "rockhead") msg += "|rockhead didn't move";
// compare with the actual nodes
if(hrow.textContent != "joerockhead") msg += "|rockhead didn't lose middle initial";
// add a new cell back int
ni = document.createElement("td");
ni.textContent = "v";
hrow.insertBefore(ni, hrow.cells[1]);
if(hrow.cells.length != 3) msg += "|wrong cell count after node insert";
if(hrow.cells[2].firstChild.data != "rockhead") msg += "|rockhead didn't move";
if(hrow.textContent != "joevrockhead") msg += "|rockhead didn't gain middle initial";

// delete row by nodes, add row by insertRow
body2.firstElementChild.remove();
if(tab.rows.length != 5) msg += "|total row count should be 5";
if(body2.rows.length != 1) msg += `|body2 length ${body2.rows.length}`;
if(body2.rows[0] != tab.rows[3]) msg += "|betty not fourth overall";
if(body2.rows[0].cells[0].textContent != "betty") msg += "|betty expected";
// before we add back in, let's review the indexes
if(body1.rows[0].rowIndex != 0 || body1.rows[0].sectionRowIndex != 0) msg += "|bad row index on 0";
if(body1.rows[1].rowIndex != 1 || body1.rows[1].sectionRowIndex != 1) msg += "|bad row index on 1";
if(body1.rows[2].rowIndex != 2 || body1.rows[2].sectionRowIndex != 2) msg += "|bad row index on 2";
if(body2.rows[0].rowIndex != 3 || body2.rows[0].sectionRowIndex != 0) msg += "|bad row index on 3";
if(tab.tFoot.rows[0].rowIndex != 4 || tab.tFoot.rows[0].sectionRowIndex != 0) msg += "|bad row index on 4";
newrow = document.createElement("tr");
newrow.appendChild(document.createElement("td"));
newrow.appendChild(document.createElement("td"));
newrow.appendChild(document.createElement("td"));
if(newrow.cells.length != 3) msg += `|newrow cell count ${newrow.cells.length}`;
newrow.cells[0].textContent = "bambam";
newrow.cells[1].textContent = "y";
newrow.cells[2].textContent = "rubble";
if(newrow.textContent != "bambamyrubble") msg += "|bambam expected";
// we could insert this into section or into table.
// but insertRow is going to make a new row for us
r2 = body2.insertRow(1);
if(body2.rows.length != 2) msg += "|body2 row length not 2 after insert";
if(body2.rows[1] != r2) msg += "|body2 r2 mismatch";
while(newrow.firstChild) r2.appendChild(newrow.firstChild);
if(r2.textContent != "bambamyrubble") msg += "|bambam not in r2";
if(r2.cells.length != 3) msg += "|bad cell count on r2";
if(tab.rows.length != 6) msg += "|row count not back up to 6";
if(body1.rows[0].rowIndex != 0 || body1.rows[0].sectionRowIndex != 0) msg += "|bad post row index on 0";
if(body1.rows[1].rowIndex != 1 || body1.rows[1].sectionRowIndex != 1) msg += "|bad post row index on 1";
if(body1.rows[2].rowIndex != 2 || body1.rows[2].sectionRowIndex != 2) msg += "|bad post row index on 2";
if(body2.rows[0].rowIndex != 3 || body2.rows[0].sectionRowIndex != 0) msg += "|bad post row index on 3";
if(body2.rows[1].rowIndex != 4 || body2.rows[1].sectionRowIndex != 1) msg += "|bad post row index on 4";
if(tab.tFoot.rows[0].rowIndex != 5 || tab.tFoot.rows[0].sectionRowIndex != 0) msg += "|bad post row index on 5";
// now add a row by nodes
newrow.appendChild(document.createElement("td"));
newrow.appendChild(document.createElement("td"));
newrow.appendChild(document.createElement("td"));
newrow.cells[0].textContent = "hoppy";
newrow.cells[1].textContent = "g";
newrow.cells[2].textContent = "rubble";
body2.append(newrow);
if(body2.rows.length != 3) msg += "|expected 3 rows with hoppy";
if(newrow.rowIndex != 5 || newrow.sectionRowIndex != 2) msg += "|bad hoppy rowIndex";
if(tab.rows.length != 7) msg += "|expected 7 with hoppy";

// add a row to the table not a section
r2 = tab.insertRow();
foot = tab.tFoot;
if(foot.rows.length != 2) msg += "|foot not length 2";
if(foot.rows[1] != r2) msg += "|r2 not at the end of foot";
if(tab.rows.length != 8) msg += "|table length not 8";
if(r2.rowIndex != 7 || r2.sectionRowIndex != 1) msg += "|bad anne rowIndex";
r2.appendChild(document.createElement("td"));
r2.appendChild(document.createElement("td"));
r2.appendChild(document.createElement("td"));
r2.cells[0].textContent = "anne";
r2.cells[1].textContent = "p";
r2.cells[2].textContent = "margrock";
if(r2.cells.length != 3) msg += "|anne cells not length 3";

tab1 = tab; // remember it for jdb

// on to the second html table.
tab = document.getElementById("tab2");
// much like table 1 except there is no caption and a specific head section.
tb = tab.tBodies;
if(tb.length != 2) msg += `|wrong body count ${tb.length}`;
if(tab.tHead.rows.length != 1) msg += "|no head row";
if(tb[0].rows.length != 2 || tb[1].rows.length != 2) msg += "|row count not 2+2";
if(tab.rows.length != 6) msg += `|2 total row count ${tab.rows.length}`;
if(tab.tFoot.rows.length != 1) msg += "|2 no rows in footer";
// not skipping past caption this time - but skipping past thead
body1 = tab.firstElementChild.nextElementSibling;
if(body1 != tab.tBodies[0]) msg += "|2 body not first tBodies";
body2 = tab.tBodies[1];
h1 = tab.tHead;
if(tab.createTHead() != h1) msg += "|didn't get same head back";
hrow = tab.tHead.rows[0]; // proper head row
if(hrow != tab.rows[0]) msg += "|2 head row not first in table";
if(hrow.cells.length != 3) msg += "|2 top row not 3 cells";
if(hrow.cells[0].nodeName != "TH") msg += "|2 top row not TH";
if(hrow.textContent != "firstmiddlelast") msg += "|2 wrong th text content";
hrow = body2.firstElementChild; // the barney row
if(hrow != tab.rows[3]) msg += "|2 barney row not fourth in table";
if(hrow != body2.rows[0]) msg += "|2 barney row not first in body2";
if(hrow.cells.length != 3) msg += "|2 barney row not 3 cells";
if(hrow.cells[0].nodeName != "TD") msg += "|2 barney row not TD";
if(hrow.textContent != "barneylrubble") msg += "|2 wrong td text content";
hrow = tab.tFoot.rows[0];
if(hrow != tab.rows[5]) msg += "|2 rockhead row not last in table";
if(hrow.cells[2].firstChild.data != "rockhead") msg += "|2 couldn't find rockhead";
tab.remove(); // don't need to see it on screen.

// what if we insert into an empty table?
tab = document.createElement("table");
r2 = tab.insertRow(0);
body1 = tab.tBodies[0];
if(tab.tBodies.length != 1 || body1.rows[0] != r2) msg += "|body not created";
if(tab.firstChild.nodeName != "TBODY") msg += "|created body not below";
if(tab.firstChild.firstChild.nodeName != "TR") msg += "|row not below body below tab";
if(r2.rowIndex != 0 || r2.sectionRowIndex != 0) msg += "|created r2 has wrong rowIndex";
// what if we already had a sectiont?
tab.firstChild.remove();
h1 = tab.createTFoot();
r2 = tab.insertRow();
if(h1.nextSibling.firstChild != r2) msg += "|new body not after foot";
r3 = h1.insertRow();
if(tab.rows.length != 2) msg += "|length not 2 after r2 and r3";
if(r2.sectionRowIndex != 0 || r3.sectionRowIndex != 0) msg += "|r2 r3 not 0 in section";
// still, bodies should come before foot
if(r3.rowIndex != 1 || r2.rowIndex != 0) msg += "|r2 not before r3";
if(tab.rows[0] != r2 || tab.rows[1] != r3) msg += "|rows not linking to r2 and r3";
r1 = tab.insertRow(0);
body1 = tab.tBodies[0];
if(r1 != body1.rows[0]) msg += "|r1 isn't first in body";
if(r1 != tab.rows[0]) msg += "|r1 not first in table";
if(body1.rows.length != 2) msg += "|body not r1 and r2";
if(body1.rows[1] != r2) msg += "|r2 not second in body";
tab.deleteRow(1);
if(body1.rows.length != 1 || r1 != body1.rows[0]) msg += "|body should have only r1";
if(r3 != tab.rows[1] || r3.rowIndex != 1) msg += "|r3 didn't slide back to position 1";

show.innerHTML = msg;
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
