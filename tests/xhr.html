<head></head><body>
<p id=show>start</p>
<script>
/* xhr tests, fetch test, await fetch test
This requires a web server with the echo program installed.
Currently using edbrowse.org, assuming it is so equipped.
You can simply browse this program in edbrowse and that's fine,
but for a chrome test, this program has to be on edbrowse.org,
or the same site as the echo responder, to satisfy
chrome's cross origin concerns.
But it's more complicated than that.
Chrome won't behave for me unless that web server is local, and /etc/hosts
is configured accordingly.
127.0.0.1       localhost www.edbrowse.org
If I do that it all works; if not, if I go across the internet,
I get a blowup network error, cannot send.
I don't understand why; but for now, I can edbrowse this and get ok,
and I can <chromeline below, with apache2 web server responding to
edbrowse.org on the current machine, and get ok.
http://www.edbrowse.org/xhr.html
*/
try {
show = document.getElementById("show")
msg = "ok";
b = document.body;
echourl = "http://www.edbrowse.org/cgi-bin/echo";
// do things synchronously for as long as we can.
// Then some asynchronous stuff and we'll need a timer to check that.
xhr = new XMLHttpRequest;
// basic get ad post
h = "";
// events work even in the synchronous case
xhr.onload = () => h+='o';
handler_r = function(e) { h += this.readyState}
xhr.addEventListener("readystatechange", handler_r);
xhr.open("get", echourl + "?baked=beans%3C%3E", false);
if(xhr.status != 0) msg += "|status not 0";
xhr.send("");
if(xhr.status != 200) msg += "|status not 200";
if(h != "14o") msg += `|sync get events ${h}`;
if(xhr.responseText != "get {\nbaked=beans%3C%3E\n}\n") msg += `|get response ${xhr.responseText}`;
ct = xhr.getResponseHeader("cOntent-type");
cl = xhr.getResponseHeader("content-length");
if(cl != 26) msg += `|sync get length ${cl}`;
// it's my echo program, and it prints out content type, so this should be
// reliable on any server.
if(ct != "text/plain") msg += `|sync get type ${ct}`;
gar = xhr.getAllResponseHeaders();
gar = gar.toLowerCase();
if(gar.indexOf("content-length: 26\r\n") < 0) msg += "|no content length in gar";

// try post, this time with search params, but I think they just stringify,
// so might not be much different than a string.
// This isn't like events; I can use the same xhr.
h = "";
usp = new URLSearchParams;
usp.append("baked", "beans<>");
xhr.open("post", echourl, false);
xhr.send(usp);
if(h != "14o") msg += `|sync post events ${h}`;
if(xhr.responseText != "post {\nbaked=beans%3C%3E\n}\n") msg += `|post response ${xhr.responseText}`;
ct = xhr.getResponseHeader("content-type");
cl = xhr.getResponseHeader("content-length");
if(cl != 27) msg += `|sync get length ${cl}`;
if(ct != "text/plain") msg += `|sync get type ${ct}`;
xhr.removeEventListener("readystatechange", handler_r);
delete xhr.onload;

/* test setRequestHeader. I tried setting cookie, because echo will send
that back to me, but chrome wouldn't do it.
Probably some kind of security risk that I don't understand.
So I settled on language, which most servers will provide
through the environment, and hence I can echo it back.
I use a back door of xyz. */
xhrl = new XMLHttpRequest;
xhrl.open("get", echourl + "?xyz", false);
xhrl.setRequestHeader("accept-language", "pt_br");
// second should concatenate
xhrl.setRequestHeader("accept-language", "cz");
xhrl.send();
if(xhrl.response.substr(0, 11) != "get {\nxyz\n}") msg += "|no xyz";
// some clients or servers include the native language of the computer,
// so we just have to check for what we set.
if(xhrl.response.indexOf("pt_br, cz") < 0) msg += `|wrong languages ${xhrl.response}`;

/* sending a string with nonascii characters is bizarre under chrome.
alpha turns into a weird chinese character.
I think the high characters are already utf8 in the string, then xhr
encodes those bytes into utf8 again.
I don't understand what it is doing, I definitely can't replicate it,
and I think clients are not suppose to do it.
If you have nonascii data to send, encode it, such as url escape,
or send it as a byte array, which is the next thing we will try. */
xhr.open("post", echourl, false);
a = new Uint8Array(6);
a[0] = 71;
a[1] = 0;
a[2] = 163;
a[3] = 101;
a[4] = 110;
a[5] = 100;
xhr.send(a);
if(xhr.response != "post {\nG%00%A3end\n}\n") msg += `|uint8 response ${xhr.response}`;
xhr.open("post", echourl, false);
a = new Uint16Array(4);
a[0] = 0x3b1; // this is alpha
a[1] = 0; // always good to test 0
a[2] = 7; // test endian
a[3] = 26984;
xhr.send(a);
if(xhr.response != "post {\n%B1%03%00%00%07%00hi\n}\n") msg += `|uint16 response ${xhr.response}`;
xhr.open("post", echourl, false);
a = new Uint32Array(2);
a[0] = 1701605491;
a[1] = 1684628590;
xhr.send(a);
if(xhr.response != "post {\nsplendid\n}\n") msg += `|uint32 response ${xhr.response}`;

// FormData is a whole nother beast
xhr.open("post", echourl, false);
fd = new FormData();
fd.append("a", "simple @ascii");
// once again we can't send utf8 in form data; chrome seems to puke on that.
fd.append("b", "this is regular ascii but a long line longer than mime standard will allow so we'll see how the browser encodes it. It doesn't seem to matter how long it is it just sits on its own line.\nLine 2.");
xhr.send(fd);
r = xhr.response;
// The browsers will send different boundaries, so we have to take it apart.
// lop off post { and }
r = r.substr(7);
r = r.substr(0, r.length - 2);
if(r.substr(0, 2) != "--") msg += "|fd doesn't begin with boundary";
if(r.match(/(?<!%0D)\n/)) msg += "|\\n without prior \\r";
r = r.replace(/%0D/g, "");
r = r.split("\n");
boundary = r[0];
if(boundary != r[4]) msg += "|boundary expected at 4";
if(boundary + "--" != r[9]) msg += "|boundary-- expected at 9";
if(r[1] != 'Content-Disposition: form-data; name="a"') msg += `|content line 1 ${r[1]}`;
if(r[5] != 'Content-Disposition: form-data; name="b"') msg += `|content line 5 ${r[5]}`;
if(r[3] != "simple @ascii%07") msg += `|line 3 ${r[3]}`;
if(r[8] != "Line 2.") msg += `|line 8 ${r[8]}`;

// asynchronous stuff.
h = ":";
xhr1 = new XMLHttpRequest;
xhr1.open("get", echourl + "?async1", true);
xhr1.onload = () => h += "o1:";
xhr1.addEventListener("readystatechange", function(e){
if(this.readyState == 4)
h += `r1${this.response.indexOf("async1") >= 0 ? "yes" : "no"}:`;
});
xhr1.addEventListener("load", function(e){
h += `l1${this.response.indexOf("async1") >= 0 ? "yes" : "no"}:`;
});
xhr1.send();

/* await fetch test, which encompasses a lot of features.
This requires a file on edbrowse.org:
{"camp":"Granada"}
We need an async function, or await doesn't work at all. */
async function awaitFetchTest()
{
function showcamp(o) { h += "camp " + o.camp + ':'}
const r = (await fetch("http://www.edbrowse.org/jscamp.json"));
h += r.headers.get("content-length") + ':'; // should be 19
// p_json is the promise of the json object
const p_json = r.json();
p_json.then(showcamp);
}
awaitFetchTest();

show.innerHTML = "mid";
setTimeout(()=> {
// things are all asynchronous, order not guaranteed
if(h.indexOf(":r1yes:o1:l1yes:") < 0 ||
h.indexOf(":19:") < 0 ||
h.indexOf(":camp Granada:") < 0)
msg += `:async string ${h}`;
show.innerHTML = msg; }, 1000);
} catch(e) { show.innerHTML = "blowup " + e + "<br" + e.stack.replace(/\n/g, "<br>");}
</script>
